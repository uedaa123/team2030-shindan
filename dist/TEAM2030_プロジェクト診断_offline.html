<title>TEAM2030 プロジェクトコンパス</title>

<style>
/* チーム2030 プロジェクト診断
   ── 配色の考え方 ──────────────────────────────────
   分野26項目に、それぞれ固有の色を割り当てている（--h0〜--h25、
   data/cases.json の genres の並び順）。選んだ分野の色が、そのまま結果画面の
   カードの上辺に出る。色は飾りではなく、自分が何を選んだかの目印。
   勇誠義礼の4タイプにも固有色がある（勇＝朱、誠＝青、義＝橙、礼＝桃）。
   色の指定は --c（文字用の濃い側）と --cv（塗り用の鮮やかな側）を
   各要素に流し込む形に統一してある。色は tools/ のパレット生成で作った26色。 */

:root{
  /* 分野26色（data/cases.json の genres と同じ順）
     h0 子ども・教育
     h1 学校・若者との協働
     h2 川・水辺・海
     h3 自然・環境
     h4 農山漁村
     h5 食・農
     h6 動物
     h7 歴史・文化
     h8 発信・記録
     h9 ものづくり・アート
     h10 まち・空き家
     h11 道・橋・インフラ
     h12 旅・場づくり
     h13 観光・関係人口
     h14 地域ブランド・知財
     h15 お金・小商い
     h16 政治・経済
     h17 IT・システムづくり
     h18 AI・デジタル
     h19 資源循環
     h20 脱炭素・エネルギー
     h21 防災・安全
     h22 からだ・健康
     h23 高齢者・ケア
     h24 心理・人間関係
     h25 福祉・多様性  */
  --h0:#8c3f2c; --h1:#8c552c; --h2:#705623; --h3:#706823;
  --h4:#677023; --h5:#557023; --h6:#437023; --h7:#327023;
  --h8:#237027; --h9:#237039; --h10:#23704b; --h11:#2c8c73;
  --h12:#2c8c89; --h13:#2c788c; --h14:#2c628c; --h15:#365dab;
  --h16:#3642ab; --h17:#4436ab; --h18:#5f36ab; --h19:#7a36ab;
  --h20:#7a2c8c; --h21:#8c2c87; --h22:#8c2c71; --h23:#8c2c5b;
  --h24:#8c2c45; --h25:#8c2c2f;

  /* 塗り用の鮮やかな側。--hN は文字にも使うので白地で読める濃さに抑えてある */
  --h0v:#bd4e32; --h1v:#bd6e32; --h2v:#a1792b; --h3v:#a1942b;
  --h4v:#93a12b; --h5v:#77a12b; --h6v:#5ca12b; --h7v:#41a12b;
  --h8v:#2ba130; --h9v:#2ba14c; --h10v:#2ba167; --h11v:#32bd99;
  --h12v:#32bdb9; --h13v:#32a2bd; --h14v:#3281bd; --h15v:#4a77cf;
  --h16v:#4a58cf; --h17v:#5a4acf; --h18v:#794acf; --h19v:#984acf;
  --h20v:#a432bd; --h21v:#bd32b7; --h22v:#bd3297; --h23v:#bd3277;
  --h24v:#bd3257; --h25v:#bd3237;

  /* 勇誠義礼 */
  --yu:#c2410c;  --sei:#1d4ed8; --gi:#a16207;  --rei:#be185d;
  --yuv:#f97316; --seiv:#3b82f6; --giv:#eab308; --reiv:#ec4899;

  --accent:#e8471f;
  --accent-soft:#fdeee9;

  /* 下地。純グレーではなく、濃紺に寄せた中間色 */
  --ink:#22263d;
  --ink-2:#59607a;
  --paper:#f4f6fa;
  --card:#ffffff;
  --deep:#20233f;
  --line:#d9deea;
  --line-2:#eaeef6;

  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",
            "Noto Sans JP",system-ui,sans-serif;
  --gothic:"Hiragino Sans","Yu Gothic","Noto Sans JP","Meiryo",system-ui,sans-serif;

  --r:14px;   /* カードの丸み */
  --r-s:10px; /* ボタンの丸み */
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
--h0:#ddaa9d; --h0v:#d28f7f; --h1:#ddb89d; --h1v:#d2a37f;
  --h2:#d2b67f; --h2v:#c7a560; --h3:#d2c97f; --h3v:#c7bc60;
  --h4:#c8d27f; --h4v:#bbc760; --h5:#b4d27f; --h5v:#a3c760;
  --h6:#a1d27f; --h6v:#8bc760; --h7:#8ed27f; --h7v:#73c760;
  --h8:#7fd283; --h8v:#60c765; --h9:#7fd296; --h9v:#60c77d;
  --h10:#7fd2a9; --h10v:#60c795; --h11:#9dddcc; --h11v:#7fd2bc;
  --h12:#9ddddb; --h12v:#7fd2cf; --h13:#9dd0dd; --h13v:#7fc1d2;
  --h14:#9dc1dd; --h14v:#7faed2; --h15:#9db2dd; --h15v:#7f9bd2;
  --h16:#9da4dd; --h16v:#7f88d2; --h17:#a59ddd; --h17v:#897fd2;
  --h18:#b39ddd; --h18v:#9c7fd2; --h19:#c29ddd; --h19v:#af7fd2;
  --h20:#d19ddd; --h20v:#c37fd2; --h21:#dd9dda; --h21v:#d27fce;
  --h22:#dd9dcb; --h22v:#d27fbb; --h23:#dd9dbc; --h23v:#d27fa8;
  --h24:#dd9dae; --h24v:#d27f94; --h25:#dd9d9f; --h25v:#d27f81;
    --yu:#fb923c; --sei:#60a5fa; --gi:#facc15; --rei:#f472b6;
    --yuv:#fb923c; --seiv:#60a5fa; --giv:#facc15; --reiv:#f472b6;
    --accent:#ff7a55; --accent-soft:#33221d;
    --ink:#e9ecf6; --ink-2:#a2aac4; --paper:#12142a; --card:#1c1f38;
    --deep:#0c0e20; --line:#333856; --line-2:#272b46;
  }
}
:root[data-theme="dark"]{
--h0:#ddaa9d; --h0v:#d28f7f; --h1:#ddb89d; --h1v:#d2a37f;
  --h2:#d2b67f; --h2v:#c7a560; --h3:#d2c97f; --h3v:#c7bc60;
  --h4:#c8d27f; --h4v:#bbc760; --h5:#b4d27f; --h5v:#a3c760;
  --h6:#a1d27f; --h6v:#8bc760; --h7:#8ed27f; --h7v:#73c760;
  --h8:#7fd283; --h8v:#60c765; --h9:#7fd296; --h9v:#60c77d;
  --h10:#7fd2a9; --h10v:#60c795; --h11:#9dddcc; --h11v:#7fd2bc;
  --h12:#9ddddb; --h12v:#7fd2cf; --h13:#9dd0dd; --h13v:#7fc1d2;
  --h14:#9dc1dd; --h14v:#7faed2; --h15:#9db2dd; --h15v:#7f9bd2;
  --h16:#9da4dd; --h16v:#7f88d2; --h17:#a59ddd; --h17v:#897fd2;
  --h18:#b39ddd; --h18v:#9c7fd2; --h19:#c29ddd; --h19v:#af7fd2;
  --h20:#d19ddd; --h20v:#c37fd2; --h21:#dd9dda; --h21v:#d27fce;
  --h22:#dd9dcb; --h22v:#d27fbb; --h23:#dd9dbc; --h23v:#d27fa8;
  --h24:#dd9dae; --h24v:#d27f94; --h25:#dd9d9f; --h25v:#d27f81;
  --yu:#fb923c; --sei:#60a5fa; --gi:#facc15; --rei:#f472b6;
  --yuv:#fb923c; --seiv:#60a5fa; --giv:#facc15; --reiv:#f472b6;
  --accent:#ff7a55; --accent-soft:#33221d;
  --ink:#e9ecf6; --ink-2:#a2aac4; --paper:#12142a; --card:#1c1f38;
  --deep:#0c0e20; --line:#333856; --line-2:#272b46;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--gothic);
     font-size:15px;line-height:1.8;-webkit-font-smoothing:antialiased;
     -webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 96px}
.wrap#app{padding-bottom:calc(96px + env(safe-area-inset-bottom))}

/* ── ヘッダー ──────────────────────────────────── */
header{background:var(--deep);color:#fff;padding:0 0 40px}
/* 26色の帯。このツールが扱う分野の数だけ色がある */
header:before{content:"";display:block;height:7px;
  background:linear-gradient(90deg,var(--h0v), var(--h1v), var(--h2v), var(--h3v), var(--h4v), var(--h5v), var(--h6v), var(--h7v), var(--h8v), var(--h9v), var(--h10v), var(--h11v), var(--h12v), var(--h13v), var(--h14v), var(--h15v), var(--h16v), var(--h17v), var(--h18v), var(--h19v), var(--h20v), var(--h21v), var(--h22v), var(--h23v), var(--h24v), var(--h25v))}
header .wrap{padding-top:40px;padding-bottom:0}
/* タイトル。濃紺の地なので、グラデーションは沈む。
   白＋アクセントの2色にして、ぶら下がりの「コンパス」だけを立たせる。
   アクセントは地が暗いぶん、本文用より明るいほうを使う。 */
h1{font-family:var(--display);font-weight:700;font-size:44px;line-height:1.16;
   margin:0 0 18px;letter-spacing:-.015em;color:#fff;text-wrap:balance}
h1 span{display:block;color:#ff8d5e}
header p{margin:0;color:#b8bfdc;font-size:16px;line-height:1.8;max-width:52ch;
  letter-spacing:.01em}
header p b{color:#fff;font-weight:700}
.eyebrow{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.24em;
  color:#7f8ab5;margin:0 0 12px}
@media(max-width:560px){
  header{padding-bottom:30px}
  header .wrap{padding-top:30px}
  h1{font-size:34px}
  header p{font-size:15px}
}

/* 進捗バー。進むほど色数が増える */
.bar{height:5px;background:var(--line-2);position:sticky;top:0;z-index:5}
.bar i{display:block;height:100%;width:0;transition:width .35s ease;
  background:linear-gradient(90deg,var(--h0v),var(--h8v) 45%,var(--h3v) 70%,var(--h4v));
  background-size:760px 100%;background-repeat:no-repeat}

/* ── 設問 ──────────────────────────────────────── */
.step{padding:40px 0 0}
.stepno{font-family:var(--display);font-weight:700;font-size:12px;color:var(--accent);
  margin:0 0 8px;letter-spacing:.14em}
h2{font-family:var(--display);font-weight:700;font-size:25px;line-height:1.5;
   margin:0 0 8px;text-wrap:balance}
@media(max-width:560px){.step{padding:28px 0 0}h2{font-size:22px}}
.hint{color:var(--ink-2);font-size:13px;margin:0 0 22px}

.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
@media(max-width:560px){.opts.two{grid-template-columns:1fr}}

button.opt{font:inherit;text-align:left;background:var(--card);
  border:2px solid var(--line);border-radius:var(--r-s);
  padding:14px 16px;cursor:pointer;color:var(--ink);min-height:50px;
  transition:border-color .13s,background .13s,transform .09s}
button.opt:hover{border-color:var(--c,var(--accent))}
button.opt:active{transform:scale(.99)}
button.opt:focus-visible{outline:3px solid var(--c,var(--accent));outline-offset:2px}
button.opt.on{border-color:var(--c,var(--accent));
  background:color-mix(in srgb,var(--cv,var(--c,var(--accent))) 12%,var(--card))}
button.opt.off{opacity:.45}
button.opt b{display:block;font-weight:700;font-family:var(--display)}
button.opt span{display:block;font-size:12.5px;color:var(--ink-2);margin-top:3px;
  line-height:1.7;font-family:var(--gothic)}

/* 色を持つ選択肢（分野・勇誠義礼）は、色の丸を左に置いて、中身は縦に積む */
button.opt.hue{display:grid;grid-template-columns:15px 1fr;column-gap:12px}
button.opt.hue:before{content:"";grid-column:1;grid-row:1;width:15px;height:15px;
  border-radius:50%;background:var(--cv,var(--c));margin-top:6px;transition:box-shadow .13s}
button.opt.hue.on:before{box-shadow:0 0 0 4px color-mix(in srgb,var(--cv,var(--c)) 30%,transparent)}
button.opt.hue > b,
button.opt.hue > span,
button.opt.hue > em{grid-column:2}

.nav{display:flex;gap:12px;align-items:center;margin-top:28px;flex-wrap:wrap}
.go{font:inherit;font-family:var(--display);font-weight:700;background:var(--accent);
    color:#fff;border:0;border-radius:var(--r-s);padding:14px 28px;cursor:pointer;
    min-height:50px;transition:filter .13s,transform .09s}
.go:hover{filter:brightness(1.08)}
.go:active{transform:scale(.99)}
.go:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.go[disabled]{background:var(--line);color:var(--ink-2);cursor:not-allowed;filter:none}
.back{font:inherit;background:none;border:0;color:var(--ink-2);cursor:pointer;
      text-decoration:underline;padding:12px 4px;min-height:50px}
.back:hover{color:var(--ink)}
.back:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.count{font-size:12.5px;color:var(--ink-2);margin-left:auto;
  font-variant-numeric:tabular-nums}

/* ── 結果 ──────────────────────────────────────── */
.res{padding:36px 0 0}
.lede{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.6;
  margin:0 0 14px;text-wrap:balance}
.recap{font-size:12.5px;color:var(--ink-2);background:var(--card);
  border:2px solid var(--line-2);border-radius:var(--r-s);
  padding:13px 15px;margin:0 0 22px;line-height:1.9}
.recap b{color:var(--ink);font-weight:700}

/* カード。上辺の色は、その分野の色 */
article{background:var(--card);border:1px solid var(--line-2);
  border-top:6px solid var(--cv,var(--c,var(--line)));
  border-radius:var(--r);padding:20px 20px 18px;margin-bottom:14px}
article.top{box-shadow:0 2px 0 0 var(--line-2),0 10px 26px -18px var(--ink)}
/* カード上の札。分野・規模・「あなたが選んだもの」 */
.rank{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.rank em{font-style:normal;font-family:var(--display);font-weight:700;font-size:11px;
  letter-spacing:.04em;color:var(--ink-2);background:var(--line-2);
  border-radius:999px;padding:3px 10px}
.rank em.pick{color:#fff;background:var(--c,var(--accent))}
h3{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.5;margin:0 0 10px;
   text-wrap:balance}
dl{margin:0;display:grid;grid-template-columns:6.5em 1fr;gap:8px 14px;font-size:13.5px}
@media(max-width:560px){dl{grid-template-columns:1fr;gap:2px 0}dl dt{margin-top:11px}}
dt{font-family:var(--display);font-weight:700;color:var(--ink-2);font-size:12px;padding-top:3px}
dd{margin:0;line-height:1.8}
.src{font-size:12px;margin-top:13px}
.src a{color:var(--c,var(--accent))}

h4.sec{font-family:var(--display);font-weight:700;font-size:19px;margin:38px 0 4px}

/* ── 解説ブロック ─────────────────────────────── */
section.block{margin:36px 0 0;padding:24px 22px;border-radius:var(--r);
  background:var(--card);border:1px solid var(--line-2);
  border-top:6px solid var(--cv,var(--c,var(--accent)))}
section.block h4{font-family:var(--display);font-weight:700;font-size:19px;
  margin:0 0 10px;color:var(--ink);text-wrap:balance}
section.block p{margin:0 0 10px;font-size:13.5px;color:var(--ink-2);line-height:1.85}
section.block .pair{background:color-mix(in srgb,var(--c,var(--accent)) 7%,var(--card));
  border-radius:var(--r-s);padding:13px 15px;margin:11px 0 0;font-size:13.5px;
  line-height:1.85}
section.block .pair b{color:var(--ink);font-family:var(--display);font-weight:700}

/* 1位のプロジェクト。今週やることと、あなたの入り方をひとつながりで見せる */
article.lead{border-top-width:8px;padding:24px 22px 20px;margin-bottom:26px;
  box-shadow:0 2px 0 0 var(--line-2),0 14px 34px -22px var(--ink)}
article.lead h3{font-size:24px;margin:0 0 10px}
@media(max-width:560px){article.lead h3{font-size:21px}}

/* 今週やること。ここがいちばん読まれる */
.todo{background:color-mix(in srgb,var(--cv,var(--accent)) 14%,var(--card));
  border-radius:var(--r-s);padding:15px 17px;margin:16px 0 0}
.todolabel{font-family:var(--display);font-weight:700;font-size:12px;
  color:var(--c,var(--accent));letter-spacing:.1em;margin:0 0 5px}
.todobody{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.7;margin:0}

/* そのプロジェクトに、あなたはどう入るか */
.youdo{background:var(--deep);color:#eef0fa;border-radius:var(--r-s);
  padding:15px 17px;margin:12px 0 0}
.youlabel{font-family:var(--display);font-weight:700;font-size:12px;color:#9aa5d0;
  letter-spacing:.06em;margin:0 0 6px}
.youbody{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.75;
  color:#fff;margin:0}
.younote{font-size:12.5px;color:#b8bfdc;line-height:1.8;margin:10px 0 0;
  padding-top:10px;border-top:1px solid rgba(255,255,255,.14)}
@media(max-width:560px){
  .todobody{font-size:16px}
  .youbody{font-size:15px}
}

/* 使わなくなった「あなたの入り方」単独ブロック（残してあるのは互換のため） */
section.me{background:var(--deep);border-color:var(--deep);color:#eef0fa;margin:0 0 30px}
section.me h4{color:#fff;font-size:21px}
section.me .mesub{font-size:12px;color:#8f9ac4;letter-spacing:.04em;margin:0 0 14px}
section.me .melead{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.75;
  color:#fff;margin:0}
section.me .pair{background:rgba(255,255,255,.09)}
section.me .pair b{color:#fff}
@media(max-width:560px){
  section.me h4{font-size:19px}
  section.me .melead{font-size:16px}
}

/* 「ひとりでやらない」は薄い地。主役は上の me なので、ここは静かにする */
section.wd{border-top-color:var(--ink-2)}
section.wd .pair{background:var(--paper)}

/* 大義。プロジェクトが何をもたらすのか */
.cause{font-size:13.5px;color:var(--c,var(--ink-2));font-weight:700;
  margin:0 0 14px;line-height:1.75}
dd.strong{font-family:var(--display);font-weight:700;font-size:15px;line-height:1.7}
.dim{font-size:12.5px;opacity:.75}

/* もう動いている場所（実在事例）。おすすめとは別の見え方にする */
article.real{border-style:dashed;border-width:1px;border-top-style:solid;border-top-width:6px;
  background:var(--paper)}

.note{font-size:12px;color:var(--ink-2);border-left:3px solid var(--cv,var(--c,var(--accent)));
  padding:8px 0 8px 13px;margin:18px 0 0;line-height:1.85}
section.me .note{color:#b8bfdc}
.restart{margin-top:34px}
.restart .go{background:var(--ink)}

/* ── 次の行動へ：コピーカード ───────────────────── */
.act{background:var(--card);border:2px solid var(--accent);border-radius:var(--r);
     padding:20px;margin:0 0 30px}
.act.tail{margin:36px 0 0}
.act h4{font-family:var(--display);font-weight:700;font-size:18px;margin:0 0 8px;
  text-wrap:balance}
.act p{font-size:12.5px;color:var(--ink-2);margin:0 0 14px;line-height:1.85}
.act .go{width:100%;text-align:center}
.act .go.done{background:var(--h3)}
.namefield{margin:0 0 14px}
.namefield label{display:block;font-size:12.5px;color:var(--ink-2);margin:0 0 6px}
.namefield input{font:inherit;width:100%;padding:12px 13px;border:2px solid var(--line);
  border-radius:var(--r-s);background:var(--paper);color:var(--ink);min-height:48px}
.namefield input:focus-visible{outline:3px solid var(--accent);outline-offset:1px;
  border-color:var(--accent)}
.copied{font-size:12.5px;color:var(--accent);font-weight:700;margin:11px 0 0;min-height:1.5em;
  line-height:1.7}
pre.preview{font-family:var(--gothic);font-size:12px;line-height:1.85;background:var(--paper);
  border-radius:var(--r-s);padding:14px;margin:12px 0 0;
  white-space:pre-wrap;word-break:break-word;color:var(--ink-2);max-height:15em;overflow:auto}
details.previewbox{margin:13px 0 0}
details.previewbox summary{font-size:12.5px;color:var(--ink-2);cursor:pointer;
  padding:4px 0}
details.previewbox summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px;
  border-radius:4px}

/* ── 読み込み失敗 ─────────────────────────────── */
.oops{background:var(--card);border:2px solid var(--accent);border-radius:var(--r);
  padding:22px;margin:40px 0 0}
.oops h2{font-size:20px;margin:0 0 10px}
.oops p{font-size:13.5px;color:var(--ink-2);margin:0 0 10px;line-height:1.85}
.oops code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;
  background:var(--paper);padding:2px 6px;border-radius:5px}

/* 自動コピーが使えないブラウザ向けの控え。
   opacity:0 や display:none にすると execCommand("copy") が効かない端末があるので、
   位置だけで画面外へ逃がす。 */
#fallbackpad{position:fixed;left:-9999px;top:0;width:1px;height:1px;
  border:0;padding:0;font-size:16px;pointer-events:none}

@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{transition-duration:.01ms !important;animation-duration:.01ms !important}
}

/* ══ 2026-09-20 作り直し：3問・結果を3つに分ける ══════════ */

/* 「複数えらべます」を見落とさせない */
.multi{display:inline-block;font-family:var(--display);font-weight:700;font-size:12.5px;
  color:var(--accent);background:var(--accent-soft);border-radius:999px;
  padding:6px 14px;margin:0 0 20px}

/* 分野の選択肢。見出しは行為、分野名は小さく添える */
.opt .gtag{justify-self:start;font-style:normal;font-size:11px;font-weight:700;
  font-family:var(--display);color:var(--c,var(--accent));
  border:1px solid var(--c,var(--accent));border-radius:999px;
  padding:1px 9px;margin-top:8px}
.step.haspad{padding-bottom:20px}

/* 下に固定する「次へ」。26個スクロールしても押せるように */
.bottombar{position:sticky;bottom:0;z-index:6;margin:0 -20px;
  padding:10px 20px calc(10px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.bottominner{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bottominner .count{margin:0;white-space:nowrap}
.bottominner .go{flex:1;text-align:center}

/* 結果の頭。「ちゃんとした1枚が出てきた」と思える見た目にする */
.doc{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r);
  padding:22px 22px 20px;margin:0 0 30px;
  box-shadow:0 2px 0 0 var(--line-2),0 18px 40px -30px var(--ink);
  position:relative;overflow:hidden}
.doc:before{content:"";position:absolute;inset:0 0 auto 0;height:5px;
  background:linear-gradient(90deg,var(--h0v),var(--h6v) 25%,var(--h12v) 50%,var(--h18v) 75%,var(--h24v))}
.docmeta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11px;letter-spacing:.08em;
  color:var(--ink-2);margin:6px 0 12px;font-variant-numeric:tabular-nums}
.docmeta span{position:relative}
.docmeta span+span:before{content:"";position:absolute;left:-8px;top:.35em;bottom:.35em;
  width:1px;background:var(--line)}
.docttl{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.3;margin:0}
.docsub{font-size:13px;color:var(--ink-2);margin:6px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0 0}
/* 白文字を乗せるので、鮮やかな側ではなく文字用の濃い側を地にする */
.chip{font-family:var(--display);font-weight:700;font-size:12px;
  color:#fff;background:var(--c,var(--accent));border-radius:999px;padding:4px 12px}
.chip.plain{background:none;color:var(--ink);border:2px solid var(--line)}
.guidelist{counter-reset:gl;list-style:none;margin:18px 0 0;padding:0;
  font-size:13px;color:var(--ink-2);line-height:1.8}
.guidelist li{counter-increment:gl;position:relative;padding:7px 0 7px 30px;
  border-top:1px solid var(--line-2)}
.guidelist li:before{content:counter(gl);position:absolute;left:0;top:9px;
  width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--paper);
  font-family:var(--display);font-weight:700;font-size:11px;
  display:flex;align-items:center;justify-content:center}
.guidelist b{color:var(--ink)}
@media(max-width:560px){.docttl{font-size:22px}.doc{padding:20px 18px 18px}}

/* 大見出しに番号 */
h4.sec{display:flex;align-items:center;gap:11px;font-size:21px;margin:44px 0 14px}
h4.sec .secno{display:inline-flex;align-items:center;justify-content:center;
  width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--paper);
  font-size:15px;flex:0 0 auto}
.subsec{font-family:var(--display);font-weight:700;font-size:14px;color:var(--ink-2);
  margin:28px 0 12px}
.forwho{font-size:12.5px;color:var(--ink-2);margin:-8px 0 14px}

/* 進め方の4ステップ */
.stlead{font-family:var(--display);font-weight:700;font-size:16px;
  color:var(--ink) !important;margin:0 0 14px !important}
ol.ststeps{margin:0;padding:0;list-style:none;counter-reset:st}
ol.ststeps li{counter-increment:st;position:relative;padding:12px 0 12px 42px;
  font-size:14.5px;line-height:1.8;border-top:1px solid var(--line-2)}
ol.ststeps li:before{content:counter(st);position:absolute;left:0;top:12px;
  width:26px;height:26px;border-radius:50%;
  background:var(--c,var(--accent));color:#fff;
  font-family:var(--display);font-weight:700;font-size:13px;
  display:flex;align-items:center;justify-content:center}
.ststuck{font-size:12.5px;color:var(--ink-2) !important;margin:16px 0 0 !important;
  padding-top:14px;border-top:1px solid var(--line-2)}

/* 共有：バディ用とチーム用 */
.shares{display:grid;gap:14px;grid-template-columns:1fr 1fr}
@media(max-width:620px){.shares{grid-template-columns:1fr}}
.share{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-s);
  padding:16px}
.sharelabel{font-family:var(--display);font-weight:700;font-size:16px;margin:0 0 4px}
.sharedesc{font-size:12.5px;color:var(--ink-2);margin:0 0 12px;line-height:1.75}
.share .go{width:100%;text-align:center}
.act{border-color:var(--line-2);border-width:1px}
.go.ghost{background:none;color:var(--ink-2);border:2px solid var(--line)}
.go.ghost:hover{color:var(--ink);border-color:var(--ink-2);filter:none}

/* ── 上の帯。いまどこにいるか ────────────────────── */
.stepper{display:flex;list-style:none;margin:32px 0 26px;padding:0;gap:4px}
.stepper li{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;
  position:relative}
.stepper li:before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:2px;
  background:var(--line);z-index:0}
.stepper li:first-child:before{display:none}
.stepper li.done:before,.stepper li.now:before{background:var(--accent)}
.stepper li i{position:relative;z-index:1;width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-weight:700;font-size:12px;font-style:normal;
  background:var(--card);border:2px solid var(--line);color:var(--ink-2)}
.stepper li.done i{background:var(--accent);border-color:var(--accent);color:#fff}
.stepper li.now i{background:var(--card);border-color:var(--accent);color:var(--accent);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.stepper li em{font-style:normal;font-size:10.5px;color:var(--ink-2);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:100%}
.stepper li.now em{color:var(--accent);font-weight:700}
@media(max-width:560px){
  .stepper{margin:24px 0 22px}
  .stepper li em{font-size:10px}
}

.step{padding-top:0}

/* ── メールで受け取る ─────────────────────────────── */
.act.mail{margin-top:14px}
.act.mail h4{font-family:var(--display);font-weight:700;font-size:17px;margin:0 0 6px}
.act.mail > p{font-size:12.5px;color:var(--ink-2);margin:0 0 16px;line-height:1.8}
.act.mail .go{width:100%;text-align:center}
.act.mail .go[disabled]{background:var(--line);color:var(--ink-2);cursor:wait}
.tiny{font-size:11.5px;color:var(--ink-2);margin:12px 0 0;line-height:1.7}

</style>
</head>

":"","summary":"制限時間内に、量と分別の質でチーム対抗。ゴミ拾いを苦行から遊びに変える。","reach":"日本じゅうに","scale":"S","scaleLabel":"ひとりでも始められる","step":"公園または河川敷の使用ルールを調べる","result":"参加10人・回収量kg・集合写真","land":"","orgs":"","ref":"検索：スポGOMI","refUrl":""},{"id":"A008","src":"事例200","title":"自宅で試した省資源のやり方を近所に広げる","genre":"自然・環境","forwho":"近所の5軒","why":"","summary":"雨水タンク・断熱・節電を自分の家で検証し、効果の数字ごと近所に渡す。自分だけで終わらせない。","reach":"目の前のひとり","scale":"S","scaleLabel":"ひとりでも始められる","step":"自宅で1つ試し、1か月分の数字を取る","result":"伝えた世帯数と、真似した家の数","land":"","orgs":"","ref":"環境省GLA","refUrl":"https://www.env.go.jp/policy/kihon_keikaku/goodlifeaward/"},{"id":"A009","src":"事例200","title":"耕作放棄地1枚（1〜3畝）で作物を育てる","genre":"食・農","forwho":"農地の持ち主と食べる人","why":"","summary":"米・大豆・そばなど1品目に絞る。売らなくても「食べきる」でよい。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"市町村の農業委員会か農地バンクに1件問い合わせる","result":"収穫量kgと収穫写真、食べた人の数","land":"","orgs":"","ref":"地域課題ソリューションベース","refUrl":"https://local-solution-base.com/"},{"id":"A010","src":"事例200","title":"味噌／醤油の仕込み会を開く","genre":"食・農","forwho":"参加した家庭","why":"","summary":"年1回の仕込みを口実に人が集まる。参加者は1年後にまた集まる理由ができる。","reach":"目の前のひとり","scale":"S","scaleLabel":"ひとりでも始められる","step":"大豆と麹の入手先を1件見つける","result":"仕込み樽の数＋参加者の持ち帰り個数","land":"","orgs":"","ref":"環境省GLA","refUrl":"https://www.env.go.jp/policy/kihon_keikaku/goodlifeaward/"},{"id":"A011","src":"事例200","title":"規格外野菜の「もったいない便」","genre":"食・農","forwho":"農家と食べ手","why":"","summary":"近隣農家の売れない野菜を週1回まとめて仲間に配る／格安販売する。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"直売所か農家1軒に「余りは出ますか」と聞く","result":"救った野菜のkgと配布先件数","land":"","orgs":"","ref":"greenz.jp","refUrl":"https://greenz.jp/"},{"id":"A012","src":"事例200","title":"郷土料理を10品、動画で残す","genre":"食・農","forwho":"作れる人が消える前の次世代","why":"","summary":"作れる人が生きているうちに、手元のスマホで記録してレシピ化する。","reach":"日本じゅうに","scale":"S","scaleLabel":"ひとりでも始められる","step":"母親か祖母の得意料理を1品、撮りながら教わる","result":"動画10本＋PDFレシピ集","land":"","orgs":"","ref":"検索：郷土料理 アーカイブ 文化庁","refUrl":""},{"id":"A013","src":"事例200","title":"学校給食に地元の魚・野菜を入れる","genre":"食・農"," and":"","orgs":"","ref":"greenz.jp","refUrl":"https://greenz.jp/"},{"id":"A019","src":"事例200","title":"町の「無料で使える場所」リストを作る","genre":"まち・空き家","forwho":"場所を探している団体","why":"","summary":"公民館・集会所・空き教室の予約方法と料金を1枚にまとめて配る。","reach":"自分のまち","scale":"S","scaleLabel":"ひとりでも始められる","step":"市のサイトで施設予約ページを全部開いてみる","result":"施設20か所の一覧表（PDF/1枚）","land":"","orgs":"","ref":"総務省ICT100選","refUrl":"https://www.soumu.go.jp/main_sosiki/joho_tsusin/top/local_support/ict/jirei/index-pop.html"},{"id":"A020","src":"事例200","title":"親子で「危ない場所マップ」を作る","genre":"まち・空き家","forwho":"通学する子ども","why":"","summary":"通学路を子どもの目線で歩き、見通しの悪い箇所を写真付きで地図化。","reach":"自分のまち","scale":"S","scaleLabel":"ひとりでも始められる","step":"子どもと通学路を1回一緒に歩く","result":"地図1枚＋改善要望の提出1件","land":"","orgs":"","ref":"地域課題ソリューションベース","refUrl":"https://local-solution-base.com/"},{"id":"A021","src":"事例200","title":"消える前の店を記録する（銭湯・喫茶店・床屋）","genre":"まち・空き家","forwho":"店主と将来の住民","why":"","summary":"閉店予定の店を訪ね、写真と店主の話を残す。閉店後に価値が跳ね上がる記録。","reach":"自分のまち","scale":"S","scaleLabel":"ひとりでも始められる","step":"一番古そうな店に、まず客として通う","result":"記録した店3軒分の写真＋インタビュー","land":"","orgs":"","ref":"greenz.jp","refUrl":"https://greenz.jp/"},{"id":"A022","src":"事例200","title":"まちに本棚を置く（一箱古本市・私設図書館）","genre":"まち・空き家","forwho":"本を読みたい人","why":"","summary":"自宅の軒先やカフェの一角に本棚を出すだけ。持ち出し自由でよい。","reach":"自分のまち","scale":"S","scaleLabel":"ひとりでも始められる","step":"本棚1つ分の本を選んで箱に詰める","result":"設置1か所＋貸出／持ち帰り冊数","land":"","orgs":"","ref":"greenz.jp","refUrl":"https://greenz.jp/"},{"id":"A023","src":"事例200","title":"ベンチか花壇を1つ増やす","genre":"まち・空き家","forwho":"休む場所がない高齢者","why":"","summary":"「休む場所がない」は全国共通の小さな課題。1つ置くだけで景色が変わる。","reach":"自分のまち","scale":"S","scaleLabel":"ひとりでも始められる","step":"自治会長に置ける場所を相談する","result":"設置1基の写真＋利用されている写真","land":"","orgs":"","ref":"環境省GLA","refUrl":"https://www.env.go.jp/policy/kihon_keikaku/goodlifeaward/"},{"id":"A024","src":"事例200","title":"市民が壊れた場所を通報する仕組みを回す","genre":"まち・空き家","forwho":"壊れた場所に困る住民","why":"","summary":"街灯切れ・穴・落書きをスマホで写真通報し、対応状況まで見える化する。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"自分のまちに通報アプリがあるか調べ、なければ写真＋メールで代替","result":"通報10件と修繕された件数","land":"","orgs":"","ref":"総務省ICT100選（市民レポーター型）","refUrl":"https://www.soumu.go.jp/main_sosiki/joho_tsusin/top/local_support/ict/jirei/index-pop.html"},{"id":"A025","src":"事例200","title":"中高生と一緒に職人・農家に「聞き書き」","genre":"子ども・教育","forwho":"名人と若い世代","why":"","summary":"若者が名人に話を聞き、その人の言葉のまま文章化する。全国に手法の蓄積がある。","reach":"日本じゅうに","scale":"M","scaleLabel":"数人いると動く","step":"地元の高校に「探究の授業で協力したい」と1本連絡","result":"聞き書き作品3本（各3000字程度）","land":"","orgs":"","ref":"聞き書き甲子園／共存の森ネットワーク","refUrl":"https://www.kikigaki.net/"},{"id":"A026","src":"事例200","title":"「ありふれた職業」の体験会を開く","genre":"子ども・教育","forwho":"子どもと保護者","why":"","summary":"花形でなく、就業人口の多い職業を子どもに体験させる。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"自分の仕事を子ども向けに30分に切り出す","result":"開催1回・参加児童数・保護者アンケート","land":"","orgs":"","ref":"内閣官房 地方創生事例集","refUrl":"https://www.chisou.go.jp/sousei/"},{"id":"A027","src":"事例200","title":"大人の読書部（1冊を4回で読み切る）","genre":"子ども・教育","forwho":"一人では読み切れない大人","why":"","summary":"一人だと積読になる本を、締切と対話で読み切る。運営コストほぼゼロ。","reach":"目の前のひとり","scale":"S","scaleLabel":"ひとりでも始められる","step":"課題図書を1冊決めて日程を4回押さえる","result":"完読1冊＋メンバーの感想レポート","land":"","orgs":"","ref":"greenz.jp","refUrl":"https://greenz.jp/"},{"id":"A028","src":"事例200","title":"探究学習のメンターになる","genre":"子ども・教育","forwho":"探究に迷う高校生","why":"","summary":"高校の探究の時間に、社会人として週1回相談に乗る。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"県教委か近隣校に「外部人材登録」の有無を聞く","result":"担当した生徒数と発表会での成果物","land":"","orgs":"","ref":"地域課題ソリューションベース","refUrl":"https://local-solution-base.com/"},{"id":"A029","src":"事例200","title":"地元の子にAI・プログラミングを教える","genre":"子ども・教育","forwho":"学ぶ場のない子ども","why":"","summary":"スクールがない地域ほど価値が高い。教える側の学習効果も大きい。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"無料教材を1つ選び、自分で最後までやってみる","result":"開催4回・受講者の作品数","land":"","orgs":"","ref":"総務省ICT100選","refUrl":"https://www.soumu.go.jp/main_sosiki/joho_tsusin/top/local_support/ict/jirei/index-pop.html"},{"id":"A030","src":"事例200","title":"不登校の子の居場所を週1回開く","genre":"子ども・教育","forwho":"学校に行けない子ども","why":"","summary":"学校でも家でもない第三の場。少人数から始められる。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"市のフリースクール／教育支援センターに見学を申し込む","result":"開室回数と延べ利用人数","land":"","orgs":"","ref":"地域課題ソリューションベース","refUrl":"https://local-solution-base.com/"},{"id":"A031","src":"事例200","title":"部活の外部コーチ／指導補助に入る","genre":"子ども・教育","forwho":"指導者がいない部活","why":"","summary":"指導者不足は全国的な課題。得意競技や吹奏楽・美術でもよい。","reach":"自分のまち","scale":"S","scaleLabel":"ひとりでも始められる","step":"中学校の部活動地域移行の窓口を市に聞く","result":"指導回数と担当生徒数","land":"","orgs":"","ref":"地域課題ソリューションベース","refUrl":"https://local-solution-base.com/"},{"id":"A032","src":"事例200","title":"スマホ・LINE教室を月2回開く","genre":"高齢者・ケア","forwho":"孫と連絡したい高齢者","why":"","summary":"「孫と連絡が取れる」は最強の動機。教える内容は3つに絞る。","reach":"自分のまち","scale":"S","scaleLabel":"ひとりでも始められる","step":"公民館に空き枠を1つ押さえる","result":"参加者数と、実際に送信できた人の割合","land":"","orgs":"","ref":"総務省ICT100選","refUrl":"https://www.soumu.go.jp/main_sosiki/joho_tsusin/top/local_support/ict/jirei/index-pop.html"},{"id":"A033","src":"事例200","title":"独居高齢者への「今日の一言」電話当番","genre":"高齢者・ケア","forwho":"独居の高齢者","why":"","summary":"1日1本、2分の電話。安否確認と孤独対策を同時に満たす。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"民生委員か社協に、既存の見守り活動の有無を聞く","result":"架電件数と継続日数","land":"","orgs":"","ref":"地域課題ソリューションベース","refUrl":"https://local-solution-base.com/"},{"id":"A034","src":"事例200","title":"介護家族のオンライン愚痴会を月1回","genre":"高齢者・ケア","forwho":"介護している家族","why":"","summary":"解決しなくてよい。話す場があるだけで離職・共倒れが減る。","reach":"自分のまち","scale":"S","scaleLabel":"ひとりでも始められる","step":"同じ立場の知人2人に声をかけて日程を決める","result":"開催回数と参加者の継続率","land":"","orgs":"","ref":"greenz.jp","refUrl":"https://greenz.jp/"},{"id":"A035","src":"事例200","title":"昔の写真をデジタル化して上映会をやる","genre":"高齢者・ケア","forwho":"記憶が薄れていく高齢者","why":"","summary":"家に眠るアルバムをスキャンし、公民館で映す。記憶が一気に動き出す。","reach":"自分のまち","scale":"S","scaleLabel":"ひとりでも始められる","step":"自宅のアルバムを100枚スキャンしてみる","result":"デジタル化枚数＋上映会1回の来場者","land":"","orgs":"","ref":"環境省GLA","refUrl":"https://www.env.go.jp/policy/kihon_keikaku/goodlifeaward/"},{"id":"A036","src":"事例200","title":"買い物・通院の相乗りを仕組み化する","genre":"高齢者・ケア","forwho":"移動できない住民","why":"","summary":"運転できる人とできない人を、無理のない範囲でつなぐ。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"保険と法規制（自家用有償運送）の要否を市に確認","result":"送迎回数と利用者数","land":"","orgs":"","ref":"地域課題ソリューションベース","refUrl":"https://local-solution-base.com/"},{"id":"A037","src":"事例200","title":"認知症の人と歩くまち歩きを企画する","genre":"高齢者・ケア","forwho":"認知症の本人と家族","why":"","summary":"「隠す」から「一緒に出かける」へ。地域の理解も同時に進む。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"地域包括支援センター（市役所で場所を聞ける）に相談する","result":"実施1回と参加者・伴走者数","land":"","orgs":"","ref":"環境省GLA","refUrl":"https://www.env.go.jp/policy/kihon_keikaku/goodlifeaward/","stepSrc":"地域包括支援センターに相談する"},{"id":"A038","src":"事例200","title":"傾聴の練習会を月2回やる","genre":"心理・人間関係","forwho":"話を聞いてもらえない人","why":"","summary":"聞く技術は練習しないと身につかない。2人1組で15分ずつ話す／聞くだけ。","reach":"目の前のひとり","scale":"S","scaleLabel":"ひとりでも始められる","step":"バディと15分ずつ、まず1回やる","result":"開催回数と、参加者の「聞かれた感」自己評価","land":"","orgs":"","ref":"チーム2030キックオフ（8/1）で扱う内容","refUrl":""},{"id":"A039","src":"事例200","title":"タイプ診断を家族・職場でやって話し合う","genre":"心理・人間関係","forwho":"家族と職場の同僚","why":"","summary":"診断そのものより「違いを言葉にできる」ことが成果。","reach":"目の前のひとり","scale":"S","scaleLabel":"ひとりでも始められる","step":"家族のうち1人に、タイプ診断を受けてもらう","result":"実施人数と、話し合いで出た「発見」リスト","land":"","orgs":"","ref":"チーム2030 8/6インサイド（ウェルスダイナミクス）","refUrl":"","stepSrc":"家族1人に診断を受けてもらう"},{"id":"A040","src":"事例200","title":"夫婦（家族）で年1回の「経営会議」を開く","genre":"心理・人間関係","forwho":"配偶者と子ども","why":"","summary":"家計・時間・5年後を、感情でなく議題として話す。議事録を残す。","reach":"目の前のひとり","scale":"S","scaleLabel":"ひとりでも始められる","step":"カレンダーに2時間だけ、家族で話す枠を取る","result":"議事録1本＋決まった行動3つ","land":"","orgs":"","ref":"greenz.jp","refUrl":"https://greenz.jp/","stepSrc":"カレンダーに2時間だけ枠を取る"},{"id":"A041","src":"事例200","title":"地域の先輩の自分史を1枚にまとめる","genre":"心理・人間関係","forwho":"語り残したい地域の先輩","why":"","summary":"本人が語れなくなる前に、転機を5つ聞いて年表にして渡す。本人にも家族にも残る。","reach":"自分のまち","scale":"S","scaleLabel":"ひとりでも始められる","step":"一番話を聞きたい人を1人決める","result":"作成した年表の枚数と、渡した人数","land":"","orgs":"","ref":"聞き書き甲子園／共存の森ネットワーク","refUrl":"https://www.kikigaki.net/"},{"id":"A042","src":"事例200","title":"地域の困りごとを30日間、毎日1つ書き出す","genre":"心理・人間関係","forwho":"困りごとを抱えたままの住民","why":"","summary":"自分の感情ではなく、人が困っている場面を記録する。30日後に地域の課題リストが1本できる。","reach":"自分のまち","scale":"S","scaleLabel":"ひとりでも始められる","step":"今日見かけた困りごとを1行書く","result":"30日分の記録と、抽出した課題10件","land":"","orgs":"","ref":"地域課題ソリューションベース","refUrl":"https://local-solution-base.com/"},{"id":"A043","src":"事例200","title":"言えなかったことを手紙にして渡す","genre":"心理・人間関係","forwho":"伝えられていない相手","why":"","summary":"親・恩師・別れた相手へ。出さなくてもよいが、書くことで前に進む。","reach":"目の前のひとり","scale":"S","scaleLabel":"ひとりでも始められる","step":"手紙を書く相手を1人決める","result":"書いた通数／渡した通数","land":"","orgs":"","ref":"greenz.jp","refUrl":"https://greenz.jp/","stepSrc":"宛先を1人決める"},{"id":"A044","src":"事例200","title":"男性が弱音を出せる場を月1回作る","genre":"心理・人間関係","forwho":"弱音を言えない男性","why":"","summary":"相談窓口に行かない層が、雑談の形でなら出せる。","reach":"目の前のひとり","scale":"S","scaleLabel":"ひとりでも始められる","step":"男性の知人2人に「愚痴だけ言う会」を提案","result":"開催回数と参加者数","land":"","orgs":"","ref":"greenz.jp","refUrl":"https://greenz.jp/"},{"id":"A045","src":"事例200","title":"地元議会を1回傍聴してレポートを書く","genre":"政治・経済","forwho":"議会を知らない住民","why":"","summary":"誰でも入れる。行った人がほぼいないので、書くだけで希少情報になる。","reach":"自分のまち","scale":"S","scaleLabel":"ひとりでも始められる","step":"次の定例会の日程を市議会サイトで調べる","result":"傍聴1回＋レポート1本","land":"","orgs":"","ref":"地域課題ソリューションベース","refUrl":"https://local-solution-base.com/"},{"id":"A046","src":"事例200","title":"市の予算書を読む会を開く","genre":"政治・経済","forwho":"税金の行方を知らない住民","why":"","summary":"自分の税金がどこに行くかを、資料を実際に開いて確認する。","reach":"自分のまち","scale":"S","scaleLabel":"ひとりでも始められる","step":"市の当初予算概要PDFをダウンロードする","result":"開催1回＋作成した支出円グラフ1枚","land":"","orgs":"","ref":"地域課題ソリューションベース","refUrl":"https://local-solution-base.com/"},{"id":"A047","src":"事例200","title":"議員・候補者に1問だけ質問して回答を公開する","genre":"政治・経済","forwho":"判断材料がない有権者","why":"","summary":"全員に同じ1問を送り、回答をそのまま並べる。中立で価値が高い。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"聞きたい質問を1つに絞って文章化する","result":"送付人数と回答率、公開ページ1本","land":"","orgs":"","ref":"検索：候補者アンケート 公開 市民","refUrl":""},{"id":"A048","src":"事例200","title":"地域の「お金の流れ」を1枚に図解する","genre":"政治・経済","forwho":"地域外に流出しているお金","why":"","summary":"地域外に出ていくお金（エネルギー・食料）を推計して可視化する。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"環境省の地域経済循環分析ツールを開く","result":"図解1枚＋推計の根拠メモ","land":"","orgs":"","ref":"地域課題ソリューションベース","refUrl":"https://local-solution-base.com/"},{"id":"A049","src":"事例200","title":"パブリックコメントを1本出す","genre":"政治・経済","forwho":"声が届いていない当事者","why":"","summary":"国や自治体が「この案をどう思いますか」と意見を集める仕組みに、実名で1本出す。30分でできる。","reach":"日本じゅうに","scale":"S","scaleLabel":"ひとりでも始められる","step":"e-Gov（国の意見募集サイト）を開いて、気になる募集を1件選ぶ","result":"提出1件＋公表された回答","land":"","orgs":"","ref":"検索：e-Gov パブリックコメント","refUrl":"","summarySrc":"国・自治体の意見募集に、実名で1本出す。所要時間は30分。","stepSrc":"e-Govのパブコメ一覧から関心あるものを1件選ぶ"},{"id":"A050","src":"事例200","title":"選挙公報を読み比べる勉強会","genre":"政治・経済","forwho":"選ぶ基準を持てない有権者","why":"","summary":"候補者の主張を並べて、事実と願望を仕分けする練習。","reach":"自分のまち","scale":"S","scaleLabel":"ひとりでも始められる","step":"過去の選挙公報を選管サイトで探す","result":"開催1回＋比較表1枚","land":"","orgs":"","ref":"地域課題ソリューションベース","refUrl":"https://local-solution-base.com/"},{"id":"A051","src":"事例200","title":"地元企業の求人と決算を調べて若者に共有する","genre":"政治・経済","forwho":"仕事がないと思っている若者","why":"","summary":"「地元には仕事がない」の思い込みを、実データで壊す。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"ハローワークの求人を20件だけ読む","result":"調査企業数＋共有した先の人数","land":"","orgs":"","ref":"地域課題ソリューションベース","refUrl":"https://local-solution-base.com/"},{"id":"A052","src":"事例200","title":"月3万円の小商いを1つ立てる","genre":"お金・小商い","forwho":"その商品を必要としている人","why":"","summary":"生活を変えずに始められる規模。単価×件数を先に決める。","reach":"目の前のひとり","scale":"S","scaleLabel":"ひとりでも始められる","step":"売るもの・価格・売り先を1枚に書く","result":"初月の売上と客数","land":"","orgs":"","ref":"greenz.jp（小商い）","refUrl":"https://greenz.jp/"},{"id":"A053","src":"事例200","title":"得意なことを1回だけ有料で売ってみる","genre":"お金・小商い","forwho":"困りごとを持つ知人","why":"","summary":"無料で配っていたものに値段をつける。心理的な壁が最大の障害。","reach":"目の前のひとり","scale":"S","scaleLabel":"ひとりでも始められる","step":"知人1人に「これ、いくらなら買う？」と聞く","result":"1件の入金記録","land":"","orgs":"","ref":"greenz.jp","refUrl":"https://greenz.jp/"},{"id":"A054","src":"事例200","title":"誰か1世帯の固定費見直しを、無料で手伝う","genre":"お金・小商い","forwho":"家計に悩む1世帯","why":"","summary":"通信・保険・サブスク。自分でやって効いた方法を、困っている人に対して使う。","reach":"目の前のひとり","scale":"S","scaleLabel":"ひとりでも始められる","step":"手伝わせてくれる人を1人見つける","result":"支援した世帯数と、月あたり削減できた額","land":"","orgs":"","ref":"地域課題ソリューションベース","refUrl":"https://local-solution-base.com/"},{"id":"A055","src":"事例200","title":"不要品を集めてバザー・寄付で地域に回す","genre":"お金・小商い","forwho":"物を必要とする人・団体","why":"","summary":"自分の家だけでなく近所から集める。売上は活動費か寄付に回すと目的が立つ。","reach":"自分のまち","scale":"S","scaleLabel":"ひとりでも始められる","step":"近所5軒に不要品の有無を聞く","result":"集めた点数と、渡った先の件数","land":"","orgs":"","ref":"J4CE","refUrl":"https://j4ce.env.go.jp/casestudy/group/1/recycle/"},{"id":"A056","src":"事例200","title":"クラウドファンディングを1本立てる","genre":"お金・小商い","forwho":"資金がなくて動けない人","why":"","summary":"資金より「共感してくれる人の実数」が測れることに価値がある。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"似たプロジェクトを10件読んで文章構成を写経","result":"支援者数と達成率","land":"","orgs":"","ref":"検索：地域 クラウドファンディング 成功事例","refUrl":""},{"id":"A057","src":"事例200","title":"地域団体の会計を引き受けて見えるようにする","genre":"お金・小商い","forwho":"会計が不透明な団体","why":"","summary":"自治会・PTA・保護者会。お金が見えない団体は不信の温床になる。引き受け手が常にいない。","reach":"自分のまち","scale":"S","scaleLabel":"ひとりでも始められる","step":"所属している団体の会計状況を聞く","result":"作成した収支報告1本と、公開した相手の数","land":"","orgs":"","ref":"地域課題ソリューションベース","refUrl":"https://local-solution-base.com/"},{"id":"A058","src":"事例200","title":"知り合いの店のPOP・値付けを手伝う","genre":"お金・小商い","forwho":"売上に悩む店主","why":"","summary":"自分の商売がなくても、他人の売上を上げれば実績になる。","reach":"自分のまち","scale":"S","scaleLabel":"ひとりでも始められる","step":"1軒に「1週間だけ試させて」と頼む","result":"改善前後の売上／客単価の比較","land":"","orgs":"","ref":"greenz.jp","refUrl":"https://greenz.jp/"},{"id":"A059","src":"事例200","title":"家業の業務を1つAIで自動化する","genre":"AI・デジタル","forwho":"家業で消耗している家族","why":"","summary":"見積書・日報・請求書など、繰り返し作業を1つだけ選ぶ。","reach":"目の前のひとり","scale":"S","scaleLabel":"ひとりでも始められる","step":"一番めんどうな作業を1つ書き出して計測する","result":"月あたり削減時間（時間／月）","land":"","orgs":"","ref":"総務省ICT100選","refUrl":"https://www.soumu.go.jp/main_sosiki/joho_tsusin/top/local_support/ict/jirei/index-pop.html"},{"id":"A060","src":"事例200","title":"地域の会議に議事録AIを入れる","genre":"AI・デジタル","forwho":"書記に消耗する地域の会議","why":"","summary":"自治会・PTA・商店会。書記の負担が消えるので歓迎されやすい。","reach":"自分のまち","scale":"S","scaleLabel":"ひとりでも始められる","step":"次の会議で自分のスマホで文字起こしを試す","result":"導入した会議数と作成時間の短縮","land":"","orgs":"","ref":"チーム2030（Notta×Claude検証）","refUrl":""},{"id":"A061","src":"事例200","title":"ゴミの日やイベントを自動で答えるLINEを作る","genre":"AI・デジタル","forwho":"情報を探せない住民","why":"","summary":"ゴミ収集日・イベント・災害情報を、聞かれたら自動で返す仕組みにする。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"市のホームページで「オープンデータ」（市が自由に使ってよいと公開しているデータ）のページを探す","result":"登録者数と月間問い合わせ数","land":"","orgs":"","ref":"総務省ICT100選（ごみ分別AIチャット）","refUrl":"https://www.soumu.go.jp/main_sosiki/joho_tsusin/top/local_support/ict/jirei/index-pop.html","titleSrc":"地元情報のLINE botを作る","summarySrc":"ゴミ収集日・イベント・災害情報を自動応答にする。","stepSrc":"市のオープンデータページを確認する"},{"id":"A062","src":"事例200","title":"方言・昔話をAIで文字化して保存する","genre":"AI・デジタル","forwho":"消えつつある方言と昔話","why":"","summary":"話者が減っている地域ほど緊急性が高い。録音は今日からできる。","reach":"日本じゅうに","scale":"S","scaleLabel":"ひとりでも始められる","step":"祖父母世代1人に30分録音させてもらう","result":"録音時間と文字起こし本数","land":"","orgs":"","ref":"環境省GLA","refUrl":"https://www.env.go.jp/policy/kihon_keikaku/goodlifeaward/"},{"id":"A063","src":"事例200","title":"高齢者向けAI活用講座を開く","genre":"AI・デジタル","forwho":"デジタルから外れる高齢者","why":"","summary":"「怖い」を「便利」に変える。教える側の理解も深まる。","reach":"自分のまち","scale":"S","scaleLabel":"ひとりでも始められる","step":"教える機能を3つに絞って、紙に書き出す","result":"開催回数と受講者が作った成果物数","land":"","orgs":"","ref":"総務省ICT100選","refUrl":"https://www.soumu.go.jp/main_sosiki/joho_tsusin/top/local_support/ict/jirei/index-pop.html","stepSrc":"教える機能を3つに絞る"},{"id":"A064","src":"事例200","title":"AIで自分史・自費出版の下書きを作る","genre":"AI・デジタル","forwho":"人生を残したい本人と家族","why":"","summary":"話した内容を構成して原稿化。完走者の卒業制作にもつながる。","reach":"目の前のひとり","scale":"S","scaleLabel":"ひとりでも始められる","step":"自分の人生を10章に分けてタイトルだけ書く","result":"原稿の章立て＋1章分の下書き","land":"","orgs":"","ref":"チーム2030 参加特典（POD出版）","refUrl":""},{"id":"A065","src":"事例200","title":"紙や口頭でやっている管理を、1つだけ表にする","genre":"AI・デジタル","forwho":"分別に迷う住民","why":"","summary":"名簿・当番表・在庫のどれか1つ。共有できた瞬間に「その人しか分からない」が1つ消える。","reach":"自分のまち","scale":"S","scaleLabel":"ひとりでも始められる","step":"名簿・当番表・在庫のうち、いま一番ややこしいものを1つ選んで、スマホで写真を撮る","result":"移行した表1つと共同編集者の人数","land":"","orgs":"","ref":"総務省ICT100選","refUrl":"https://www.soumu.go.jp/main_sosiki/joho_tsusin/top/local_support/ict/jirei/index-pop.html","titleSrc":"紙・口頭でやっている管理を1つ表にする","summarySrc":"名簿・当番表・在庫。共有できた瞬間に、属人化が1つ消える。","stepSrc":"一番混乱している紙を1枚デジタル化"},{"id":"A066","src":"事例200","title":"地域のイベント情報を1か所に集約する","genre":"AI・デジタル","forwho":"属人化で困っている団体","why":"","summary":"バラバラな告知を1枚のカレンダーにまとめるだけで人が動く。","reach":"自分のまち","scale":"S","scaleLabel":"ひとりでも始められる","step":"来月のイベントを10件集めて表にする","result":"掲載イベント数と閲覧数","land":"","orgs":"","ref":"地域課題ソリューションベース","refUrl":"https://local-solution-base.com/"},{"id":"A067","src":"事例200","title":"廃材で家具・看板を1つ作る","genre":"ものづくり・アート","forwho":"それを使う人・見る人","why":"","summary":"材料費がほぼゼロ。物として残るので成果が一目でわかる。","reach":"自分のまち","scale":"S","scaleLabel":"ひとりでも始められる","step":"解体現場か製材所に端材をもらいに行く","result":"完成物1点の写真","land":"","orgs":"","ref":"環境省GLA","refUrl":"https://www.env.go.jp/policy/kihon_keikaku/goodlifeaward/"},{"id":"A068","src":"事例200","title":"シャッター・壁に絵を1面描く","genre":"ものづくり・アート","forwho":"シャッター街の通行人","why":"","summary":"許可さえ取れれば1日で終わる。写真映えするので波及しやすい。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"描かせてくれる壁を1か所探して所有者に打診","result":"完成1面＋通行人の反応","land":"","orgs":"","ref":"環境省GLA","refUrl":"https://www.env.go.jp/policy/kihon_keikaku/goodlifeaward/"},{"id":"A069","src":"事例200","title":"子どもの絵を商品にする","genre":"ものづくり・アート","forwho":"描いた子ども本人","why":"","summary":"Tシャツ・缶バッジ・パッケージに。作った子の自己効力感が跳ね上がる。","reach":"目の前のひとり","scale":"S","scaleLabel":"ひとりでも始められる","step":"子ども5人に絵を描いてもらう","result":"制作点数と販売／配布数","land":"","orgs":"","ref":"環境省GLA","refUrl":"https://www.env.go.jp/policy/kihon_keikaku/goodlifeaward/"},{"id":"A070","src":"事例200","title":"手仕事を習って、半年後に教える側に回る","genre":"ものづくり・アート","forwho":"後継者がいない技","why":"","summary":"染め・木工・編み・刃物研ぎ。継承者不足の分野ほど歓迎される。","reach":"日本じゅうに","scale":"M","scaleLabel":"数人いると動く","step":"近隣の工房・シルバー人材センターを1件訪ねる","result":"習得回数＋自分が教えた人数","land":"","orgs":"","ref":"環境省GLA","refUrl":"https://www.env.go.jp/policy/kihon_keikaku/goodlifeaward/"},{"id":"A071","src":"事例200","title":"まちの音を録って作品にする","genre":"ものづくり・アート","forwho":"消えていく音の記録","why":"","summary":"祭り・港・工場・電車。消えていく音は誰も記録していない。","reach":"日本じゅうに","scale":"S","scaleLabel":"ひとりでも始められる","step":"スマホで自宅周辺の音を3か所録る","result":"収録トラック数＋公開1本","land":"","orgs":"","ref":"greenz.jp","refUrl":"https://greenz.jp/"},{"id":"A072","src":"事例200","title":"障がいのある人のアート展を1回開く","genre":"ものづくり・アート","forwho":"発表の場がない作り手","why":"","summary":"場所と壁があれば成立する。写真に撮ってネットに残す形とも相性がよい。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"福祉施設1か所に作品の有無を聞く","result":"展示点数と来場者数","land":"","orgs":"","ref":"地域課題ソリューションベース","refUrl":"https://local-solution-base.com/","summarySrc":"場所と壁があれば成立する。デジタルアーカイブ化も相性がよい。"},{"id":"A073","src":"事例200","title":"地域の人を100人インタビューして図鑑にする","genre":"発信・記録","forwho":"知られていない地域の人","why":"","summary":"「すごい人図鑑」形式。1人分でも成果、100人で資産になる。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"話を聞きたい人を1人決めて、連絡して日程をもらう","result":"掲載人数と公開ページ／冊子","land":"","orgs":"","ref":"房総すごい人図鑑（greenz.jp）","refUrl":"https://greenz.jp/","stepSrc":"1人目のアポを取る"},{"id":"A074","src":"事例200","title":"商店主の1分動画を10本撮る","genre":"発信・記録","forwho":"発信できない商店主","why":"","summary":"店主が自分では作らないものを代わりに作る。感謝され、実績も残る。","reach":"自分のまち","scale":"S","scaleLabel":"ひとりでも始められる","step":"一番仲のいい店に「1分だけ撮らせて」と頼む","result":"公開本数と再生数","land":"","orgs":"","ref":"greenz.jp","refUrl":"https://greenz.jp/"},{"id":"A075","src":"事例200","title":"ローカルポッドキャストを月2本出す","genre":"発信・記録","forwho":"記録されない地域の声","why":"","summary":"収録30分・編集30分から始める。継続すると地域の記録媒体になる。","reach":"自分のまち","scale":"S","scaleLabel":"ひとりでも始められる","step":"最初に話を聞くゲストを1人決めて、声をかける","result":"配信本数と再生数","land":"","orgs":"","ref":"greenz.jp","refUrl":"https://greenz.jp/","stepSrc":"1本目のゲストを決める"},{"id":"A076","src":"事例200","title":"フリーペーパーを年2回出す","genre":"発信・記録","forwho":"紙でしか届かない層","why":"","summary":"紙は年配層に届く。4ページ・両面2枚で十分成立する。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"入れたい記事を4本だけ決める","result":"発行部数と設置店舗数","land":"","orgs":"","ref":"greenz.jp","refUrl":"https://greenz.jp/"},{"id":"A077","src":"事例200","title":"地域の家族を無料で撮って、写真を渡す","genre":"発信・記録","forwho":"撮ってもらう機会がない家族","why":"","summary":"写真館に行かない家庭は多い。撮って渡すだけで確実に喜ばれ、地域の記録にもなる。","reach":"目の前のひとり","scale":"S","scaleLabel":"ひとりでも始められる","step":"1家族に声をかけて撮らせてもらう","result":"撮影した家族数と、渡した枚数","land":"","orgs":"","ref":"greenz.jp","refUrl":"https://greenz.jp/"},{"id":"A078","src":"事例200","title":"「地元の今日の一枚」を100日投稿する","genre":"発信・記録","forwho":"地域の風景の記録","why":"","summary":"毎日1枚。100日後には、その土地の記録になっている。","reach":"自分のまち","scale":"S","scaleLabel":"ひとりでも始められる","step":"今日の1枚を撮って投稿する","result":"投稿日数とフォロワー増加数","land":"","orgs":"","ref":"greenz.jp","refUrl":"https://greenz.jp/","summarySrc":"毎日1枚。100日後にはその土地の記録アーカイブになっている。"},{"id":"A079","src":"事例200","title":"地名の由来を調べて説明板を立てる","genre":"歴史・文化","forwho":"由来を知らない住民","why":"","summary":"図書館の郷土資料で調べられる。板を1枚立てれば形になる。","reach":"自分のまち","scale":"S","scaleLabel":"ひとりでも始められる","step":"図書館の郷土資料コーナーに行く","result":"調べた地名数＋設置1枚","land":"","orgs":"","ref":"地域課題ソリューションベース","refUrl":"https://local-solution-base.com/"},{"id":"A080","src":"事例200","title":"途絶えた祭り・行事を小さく復活させる","genre":"歴史・文化","forwho":"途絶えた行事と地域の記憶","why":"","summary":"元の規模を目指さない。10人でやる縮小版から始める。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"当時を知る人を3人探して話を聞く","result":"開催1回と参加者数","land":"","orgs":"","ref":"環境省GLA","refUrl":"https://www.env.go.jp/policy/kihon_keikaku/goodlifeaward/"},{"id":"A081","src":"事例200","title":"石碑・道祖神・庚申塔をマッピングする","genre":"歴史・文化","forwho":"記録されていない石造物","why":"","summary":"歩いて写真を撮って地図に落とすだけ。誰もやっていない地域が多い。","reach":"日本じゅうに","scale":"S","scaleLabel":"ひとりでも始められる","step":"半径1kmを歩いて5基見つける","result":"記録した基数＋公開地図1枚","land":"","orgs":"","ref":"5actions.jp","refUrl":"https://5actions.jp/"},{"id":"A082","src":"事例200","title":"戦争・災害の体験を3人分聞き取る","genre":"歴史・文化","forwho":"語り手が消える前の記録","why":"","summary":"時間切れが迫っている領域。3人でも一次資料になる。","reach":"日本じゅうに","scale":"S","scaleLabel":"ひとりでも始められる","step":"家族・親戚に該当者がいないか確認する","result":"録音3本＋文字起こし","land":"","orgs":"","ref":"聞き書き甲子園／共存の森ネットワーク","refUrl":"https://www.kikigaki.net/"},{"id":"A083","src":"事例200","title":"古地図と現在を重ねて歩く会を開く","genre":"歴史・文化","forwho":"土地の変化を知りたい住民","why":"","summary":"国土地理院や図書館の資料で無料で用意できる。参加者の反応が良い。","reach":"自分のまち","scale":"S","scaleLabel":"ひとりでも始められる","step":"明治期の地図と現在の地図を1枚ずつ用意","result":"開催1回と参加者数","land":"","orgs":"","ref":"地域課題ソリューションベース","refUrl":"https://local-solution-base.com/"},{"id":"A084","src":"事例200","title":"家と屋号の来歴を聞き取って記録する","genre":"歴史・文化","forwho":"家と屋号の来歴","why":"","summary":"集落の家々の由来・屋号・移り住んだ経緯。知る人が減り続けている一次情報。","reach":"自分のまち","scale":"S","scaleLabel":"ひとりでも始められる","step":"集落で一番古い家を1軒訪ねて、話を聞かせてもらえるか頼む","result":"記録した戸数と、聞き取った証言数","land":"","orgs":"","ref":"聞き書き甲子園／共存の森ネットワーク","refUrl":"https://www.kikigaki.net/","stepSrc":"一番古い家を1軒訪ねる"},{"id":"A085","src":"事例200","title":"ハザードマップを持って実際に歩く","genre":"防災・安全","forwho":"危険を知らない住民","why":"","summary":"地図で見るのと歩くのは別物。1回で危険箇所が体で分かる。","reach":"自分のまち","scale":"S","scaleLabel":"ひとりでも始められる","step":"市のハザードマップを印刷する","result":"歩いた距離＋気づき写真10枚","land":"","orgs":"","ref":"地域課題ソリューションベース","refUrl":"https://local-solution-base.com/"},{"id":"A086","src":"事例200","title":"非常食を食べて買い足す会を開く","genre":"防災・安全","forwho":"備えのない家庭","why":"","summary":"非常食を普段のごはんとして食べ、食べたぶんを買い足す（ローリングストック）。参加者が家に帰ってすぐ実行できる。","reach":"自分のまち","scale":"S","scaleLabel":"ひとりで ひとりでも始められる","step":"血圧計や握力計を借りられる先（保健センター・薬局など）を1件探す","result":"測定した人数と、受診をすすめた件数","land":"","orgs":"","ref":"地域課題ソリューションベース","refUrl":"https://local-solution-base.com/","stepSrc":"測定器を借りられる先を1件探す"},{"id":"A092","src":"事例200","title":"ラジオ体操を復活させる","genre":"からだ・健康","forwho":"集まる口実がない住民","why":"","summary":"場所と時間だけ。子どもと高齢者が同時に集まる稀有な仕組み。","reach":"自分のまち","scale":"S","scaleLabel":"ひとりでも始められる","step":"公園を1つ選んで1週間だけやってみる","result":"開催日数と参加者数","land":"","orgs":"","ref":"地域課題ソリューションベース","refUrl":"https://local-solution-base.com/"},{"id":"A093","src":"事例200","title":"誰でも出られる運動会・ニュースポーツ大会","genre":"からだ・健康","forwho":"運動から外れていた人","why":"","summary":"モルック等、体力差が関係ない種目を選ぶと参加者が広がる。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"種目を1つ決めて道具を借りる","result":"参加者数とチーム数","land":"","orgs":"","ref":"地域課題ソリューションベース","refUrl":"https://local-solution-base.com/"},{"id":"A094","src":"事例200","title":"健診・献血の呼びかけを1回やる","genre":"からだ・健康","forwho":"輸血や治療を待つ人","why":"","summary":"自分が行って発信するだけでも人は動く。数字で成果が出る。","reach":"日本じゅうに","scale":"S","scaleLabel":"ひとりでも始められる","step":"自分が健診か献血の予約を取る","result":"同行／申込に至った人数","land":"","orgs":"","ref":"地域課題ソリューションベース","refUrl":"https://local-solution-base.com/","stepSrc":"自分が予約を取る"},{"id":"A095","src":"事例200","title":"野良猫を1匹、手術して元の場所に戻す","genre":"動物","forwho":"猫と苦情に困る住民","why":"","summary":"つかまえて、不妊手術をして、元いた場所に戻す（TNRと呼ばれるやり方）。費用を助成してくれる自治体が多い。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"市役所の環境課か生活衛生課に電話して、猫の不妊手術の助成があるか聞く","result":"実施頭数と苦情件数の変化","land":"","orgs":"","ref":"5actions.jp","refUrl":"https://5actions.jp/","titleSrc":"地域猫のTNRを1匹から始める","summarySrc":"捕獲・不妊手術・元の場所へ。助成金がある自治体が多い。","stepSrc":"市の助成制度の有無を調べる"},{"id":"A096","src":"事例200","title":"保護犬猫の譲渡会を1回手伝う","genre":"動物","forwho":"行き場のない犬猫","why":"","summary":"主催でなく手伝いから。会場設営・撮影・SNSでも十分貢献できる。","reach":"自分のまち","scale":"S","scaleLabel":"ひとりでも始められる","step":"近隣の保護団体に連絡する","result":"参加した会の数と成立した譲渡件数","land":"","orgs":"","ref":"5actions.jp","refUrl":"https://5actions.jp/"},{"id":"A097","src ps://www.mlit.go.jp/sogoseisaku/region/tedukuri/gaiyo/main_r6.html"},{"id":"A122","src":"事例200","title":"魚釣り体験と水質調査をセットにした親子イベント","genre":"川・水辺・海","forwho":"親子と、水質の長期記録","why":"","summary":"遊びの中に調査を混ぜる。子どもが自分で測ったデータは親にも効く。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"パックテスト等の簡易水質キットを1つ買う","result":"開催1回・親子の参加組数・測定値の記録","land":"","orgs":"","ref":"手づくり郷土賞R6（水辺基盤協会）","refUrl":"https://www.mlit.go.jp/sogoseisaku/region/tedukuri/gaiyo/main_r6.html"},{"id":"A123","src":"事例200","title":"地元の絶滅危惧の淡水魚を小学校と一緒に増やす","genre":"川・水辺・海","forwho":"絶滅が近い在来魚","why":"","summary":"生態調査・増殖・生息環境保全・環境学習をひとつなぎにする。","reach":"日本じゅうに","scale":"M","scaleLabel":"数人いると動く","step":"県の水産試験場か研究所に1本問い合わせる","result":"調査回数と放流した個体数","land":"","orgs":"","ref":"手づくり郷土賞R6（ニッコウイワナに学ぶ会・日光市）","refUrl":"https://www.mlit.go.jp/sogoseisaku/region/tedukuri/gaiyo/main_r6.html"},{"id":"A124","src":"事例200","title":"卵から孵化までを家庭の冷蔵庫で観察して川に放す","genre":"川・水辺・海","forwho":"子どもと川の未来","why":"","summary":"家庭で完結する小ささなのに、子どもの関心が環境問題まで一気に伸びる。","reach":"自分のまち","scale":"S","scaleLabel":"ひとりでも始められる","step":"地元で許可される魚種と手続きを確認する","result":"観察日誌と放流写真","land":"","orgs":"","ref":"手づくり郷土賞R6（ニッコウイワナに学ぶ会）","refUrl":"https://www.mlit.go.jp/sogoseisaku/region/tedukuri/gaiyo/main_r6.html"},{"id":"A125","src":"事例200","title":"不法投棄を片づけて「子どもが遊べる河原」に戻す","genre":"川・水辺・海","forwho":"遊び場のない子ども","why":"","summary":"ゴミの撤去が終わった瞬間から場として使える。成果が一目でわかる。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"現地を1回歩いて、ゴミの量を写真で記録","result":"撤去した量と、遊びに来た子どもの数","land":"","orgs":"","ref":"手づくり郷土賞R6（馬入水辺の楽校・平塚市）","refUrl":"https://www.mlit.go.jp/sogoseisaku/region/tedukuri/gaiyo/main_r6.html"},{"id":"A126","src":"事例200","title":"同じ場所で毎年、魚類調査を続ける","genre":"川・水辺・海","forwho":"長期データがない川","why":"","summary":"1回では意味がなく、続けると誰にも作れないデータになる。","reach":"日本じゅうに","scale":"S","scaleLabel":"ひとりでも始められる","step":"調査地点を1か所決めて座標を記録する","result":"調査回数と、確認種数の年次推移","land":"","orgs":"","ref":"手づくり郷土賞R6（矢田・庄内川をきれいにする会・名古屋市）","refUrl":"https://www.mlit.go.jp/sogoseisaku/region/tedukuri/gaiyo/main_r6.html"},{"id":"A127","src":"事例200","title":"手つかずの湿地・湖岸を保全して観察会を開く","genre":"川・水辺・海","forwho":"手つかずのまま失われる湿地","why":"","summary":"放置されていた場所ほど生きものが濃い。専門家と住民の混成チームで運営する。","reach":"日本じゅうに","scale":"M","scaleLabel":"数人いると動く","step":"市町村か県に「手つかずの土地」の管理者を聞く","result":"観察会の開催回数と初参加者の割合","land":"","orgs":"","ref":"手づくり郷土賞R6（おにぐるみの学校・大津市）","refUrl":"https://www.mlit.go.jp/sogoseisaku/region/tedukuri/gaiyo/main_r6.html"},{"id":"A128","src":"事例200","title":"湿地・休耕田を再生して小学校の学習田にする","genre":"川・水辺・海","forwho":"学校と子ども食堂","why":"","summary":"保全と教育と食が一本につながる。収穫した米を子ども食堂に回す展開もある。","reach":"自分のまち","scale":"L","scaleLabel":"十数人か、許認可が要る","step":"近隣小学校に「田んぼの授業」の需要を聞く","result":"再生面積と、学校行事としての年間実施回数","land":"","orgs":"","ref":"手づくり郷土賞R6大賞（アザメの会・唐津市）","refUrl":"https://www.mlit.go.jp/sogoseisaku/region/tedukuri/gaiyo/main_r6.html"},{"id":"A129","src":"事例200","title":"海岸・港を使った子ども向けイベントを立ち上げる","genre":"川・水辺・海","forwho":"使われていない公共空間","why":"","summary":"整備済みだが使われていない公共空間は全国にある。使う人がいないだけ。","reach":"自分のまち","scale":"L","scaleLabel":"十数人か、許認可が要る","step":"地元の海岸・港の利用ルールを管理者に確認","result":"参加児童数と観覧者数","land":"","orgs":"","ref":"手づくり郷土賞R6（奈半利町みなと未来会議）","refUrl":"https://www.mlit.go.jp/sogoseisaku/region/tedukuri/gaiyo/main_r6.html"},{"id":"A130","src":"事例200","title":"手作りの案内看板を設置して通行人に見せる","genre":"川・水辺・海","forwho":"通りがかりの住民","why":"","summary":"散歩・サイクリング客の目を楽しませるだけで、活動の認知が変わる。","reach":"自分のまち","scale":"S","scaleLabel":"ひとりでも始められる","step":"1枚目に何を書くか決めて板を用意する","result":"設置枚数と、声をかけられた回数","land":"","orgs":"","ref":"手づくり郷土賞R6（水辺基盤協会）","refUrl":"https://www.mlit.go.jp/sogoseisaku/region/tedukuri/gaiyo/main_r6.html"},{"id":"A131","src":"事例200","title":"国道・県道沿いに花を植え続ける","genre":"道・橋・インフラ","forwho":"荒れた沿道と通行者","why":"","summary":"3人から始まった活動が20年続いている例がある。着手が軽く継続で効く。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"道路管理者に沿道での植栽可否を確認","result":"植栽区間の長さと継続年数","land":"","orgs":"","ref":"手づくり郷土賞R6（R29活性化委員会・鳥取）","refUrl":"https://www.mlit.go.jp/sogoseisaku/region/tedukuri/gaiyo/ma epSrc":"近隣のインフラツーリズム受入施設を調べる"},{"id":"A137","src":"事例200","title":"月1回の清掃を「10年続ける前提」で始める","genre":"道・橋・インフラ","forwho":"汚れ続ける公共空間","why":"","summary":"短期の盛り上がりでなく、続く形で設計する。人数は少なくてよい。","reach":"自分のまち","scale":"S","scaleLabel":"ひとりでも始められる","step":"第1回の日時と場所を決めて公表する","result":"継続月数と参加延べ人数","land":"","orgs":"","ref":"手づくり郷土賞R6（金沢片町まちづくり会議）","refUrl":"https://www.mlit.go.jp/sogoseisaku/region/tedukuri/gaiyo/main_r6.html"},{"id":"A138","src":"事例200","title":"旧街道・廃線跡を歩いて案内板を立てる","genre":"道・橋・インフラ","forwho":"忘れられた旧道","why":"","summary":"歴史遺産の発掘・修復と、歩ける道の整備が同時に進む。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"古地図で旧道の位置を1本特定する","result":"調査した地点数と設置した案内板数","land":"","orgs":"","ref":"手づくり郷土賞R6（井口・鈴が峰／ながと大内湯けむり街道）","refUrl":"https://www.mlit.go.jp/sogoseisaku/region/tedukuri/gaiyo/main_r6.html"},{"id":"A139","src":"事例200","title":"地元の産品の名前を、商標として登録する","genre":"地域ブランド・知財","forwho":"名前を守れない産地","why":"","summary":"「地域名＋商品名」を組合などで登録して、勝手に使われないようにする制度（地域団体商標）。取る過程で地域がまとまる。","reach":"日本じゅうに","scale":"L","scaleLabel":"十数人か、許認可が要る","step":"特許庁のサイトで、地域団体商標のガイドブックを1冊読む","result":"出願1件と、参加した事業者数","land":"","orgs":"","ref":"特許庁 地域団体商標の活用事例","refUrl":"https://www.jpo.go.jp/system/trademark/gaiyo/chidan/katsuyo-jire.html","titleSrc":"地元の産品を地域団体商標に登録する","summarySrc":"地域名＋商品名を組合等で権利化する制度。取得の過程で地域の結束が生まれる。","stepSrc":"特許庁の地域団体商標ガイドブックを1冊読む"},{"id":"A140","src":"事例200","title":"商工会議所・組合を巻き込んで産品名を守る","genre":"地域ブランド・知財","forwho":"ばらばらに戦う事業者","why":"","summary":"全国初の商工会議所による取得例もある。個人でなく団体で取るのがこの制度。","reach":"自分のまち","scale":"L","scaleLabel":"十数人か、許認可が要る","step":"地元の商工会議所に相談窓口があるか聞く","result":"参加事業者数と協議回数","land":"","orgs":"","ref":"特許庁（中津からあげ・大分県）","refUrl":"https://www.jpo.go.jp/system/trademark/gaiyo/chidan/katsuyo-jire.html"},{"id":"A141","src":"事例200","title":"「うちの町らしさとは何か」を関係者で言語化する","genre":"地域ブランド・知財","forwho":"らしさを見失った地域","why":"","summary":"活気を失った温泉地が、商標取得を機に自らを問い直して再生した例がある。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"関係者5人に「らしさとは」を聞いて回る","result":"参加者数と、まとまった定義文1本","land":"","orgs":"","ref":"特許庁（玉造温泉・島根県）","refUrl":"https://www.jpo.go.jp/system/trademark/gaiyo/chidan/katsuyo-jire.html"},{"id":"A142","src":"事例200","title":"産品の認定基準を文章で決める","genre":"地域ブランド・知財","forwho":"品質がばらつく産地","why":"","summary":"「何をもって本物とするか」を決めると、品質管理と信頼が同時に立つ。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"似た産品の認定基準を3つ集めて読む","result":"基準書1本と、適合を確認した事業者数","land":"","orgs":"","ref":"特許庁（風間浦鮟鱇・青森県）","refUrl":"https://www.jpo.go.jp/system/trademark/gaiyo/chidan/katsuyo-jire.html"},{"id":"A143","src":"事例200","title":"伝統工芸の技を、権利で守って継承につなぐ","genre":"地域ブランド・知財","forwho":"継承者がいない工芸","why":"","summary":"染織物などの価値とデザインを制度で保護し、本物の技術の継承につなげる考え方。","reach":"日本じゅうに","scale":"L","scaleLabel":"十数人か、許認可が要る","step":"地元に残る工芸を1つ選んで現状を聞く","result":"保護した意匠・商標の件数と後継者数","land":"","orgs":"","ref":"特許庁（琉球びんがた／琉球かすり・沖縄県）","refUrl":"https://www.jpo.go.jp/system/trademark/gaiyo/chidan/katsuyo-jire.html"},{"id":"A144","src":"事例200","title":"学生に地域産品の新商品プランを考えてもらう","genre":"地域ブランド・知財","forwho":"発想が固まった産地","why":"","summary":"若い発想と、外の目。全国規模の学生コンテストが実際に行われている。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"近隣の大学・高校のゼミに1本声をかける","result":"提出プラン数と、実現に進んだ数","land":"","orgs":"","ref":"特許庁 全国地域ブランド総選挙","refUrl":"https://www.jpo.go.jp/system/trademark/gaiyo/chidan/katsuyo-jire.html"},{"id":"A145","src":"事例200","title":"特産品の味の違いを、1枚の図にする","genre":"地域ブランド・知財","forwho":"選ぶ基準がない消費者","why":"","summary":"甘い・酸っぱい・濃いなどを図にするだけで、詳しくない人でも選べる商品になる。","reach":"日本じゅうに","scale":"S","scaleLabel":"ひとりでも始められる","step":"同じ種類の産品を5銘柄そろえて、実際に食べ比べ・飲み比べする","result":"チャート1枚と、対応した銘柄数","land":"","orgs":"","ref":"特許庁（球磨焼酎・熊本県）","refUrl":"https://www.jpo.go.jp/system/trademark/gaiyo/chidan/katsuyo-jire.html","titleSrc":"特産品のフレーバーチャートを作る","summarySrc":"味の違いを図にするだけで、素人でも選べる商品になる。","stepSrc":"5銘柄を実際に飲み比べ・食べ比べする"},{"id":"A146","src":"事例200","title":"家庭に苗を配って「まちの生産者」を増やす","genre":"地域ブランド・知財","forwho":"生産者が減る産地","why":"","summary":"生産者・学校・福祉作業所・商店街・行政を巻き込んだ枠組みの例がある。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"配れる苗を50株用意する","result":"配布した苗の数と、育てた家庭数","land":"","orgs":"","ref":"特許庁（内藤とうがらし・東京都新宿）","refUrl":"https://www.jpo.go.jp/system/trademark/gaiyo/chidan/katsuyo-jire.html"},{"id":"A147","src":"事例200","title":"地域の味を給食に入れて次世代のファンを作る","genre":"地域ブランド・知財","forwho":"その産品を知らない子ども","why":"","summary":"子どもの舌に入れば長く効く。シャッター街対策や食材廃棄防止とも接続できる。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"学校給食の献立担当に相談する","result":"採用回数と対象児童数","land":"","orgs":"","ref":"特許庁（尼崎あんかけチャンポン・兵庫県）","refUrl":"https://www.jpo.go.jp/system/trademark/gaiyo/chidan/katsuyo-jire.html"},{"id":"A148","src":"事例200","title":"学生・若者がSNSリレーで地域の店をつなぐ","genre":"地域ブランド・知財","forwho":"埋もれている個店","why":"","summary":"月1回のリレー投稿で小さなコミュニティをつなぐ。無理なく続けられるのが強み。","reach":"自分のまち","scale":"S","scaleLabel":"ひとりでも始められる","step":"参加してくれる店を3軒集める","result":"参加店舗数と投稿数","land":"","orgs":"","ref":"特許庁（沖縄そば・沖縄県）","refUrl":"https://www.jpo.go.jp/system/trademark/gaiyo/chidan/katsuyo-jire.html"},{"id":"A149","src":"事例200","title":"地域で分別のやり方を揃えて、計量結果を共有する","genre":"資源循環","forwho":"ごみの量に無自覚な家庭","why":"","summary":"家庭ごとにバラバラな分別を揃え、減った量を持ち寄る。個人でなく面で効かせる。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"5世帯に1か月の計量を頼む","result":"参加世帯数と、地域全体の可燃ごみ削減量","land":"","orgs":"","ref":"上勝町ゼロ・ウェイストセンター（J4CE）","refUrl":"https://j4ce.env.go.jp/"},{"id":"A150","src":"事例200","title":"地域に資源の持ち寄り拠点を作る","genre":"資源循環","forwho":"分別先がない住民","why":"","summary":"分別ステーションを1か所作ると、周辺の行動がまとめて変わる。","reach":"自分のまち","scale":"L","scaleLabel":"十数人か、許認可が要る","step":"既存の集積所の運用ルールを調べる","result":"持ち込み世帯数と回収量","land":"","orgs":"","ref":"上勝町ゼロ・ウェイストセンター（J4CE）","refUrl":"https://j4ce.env.go.jp/"},{"id":"A151","src":"事例200","title":"修理して使い続ける「リペアカフェ」を月1回開く","genre":"資源循環","forwho":"捨てるしかなかった人","why":"","summary":"直せる人と直したい人を月1回だけ引き合わせる。道具と場所があれば成立。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"直せる人を3人見つける","result":"開催回数と、修理できた点数","land":"","orgs":"","ref":"J4CE","refUrl":"https://j4ce.env.go.jp/casestudy/group/1/recycle/"},{"id":"A152","src":"事例200","title":"制服・体操服・道具のリユース会を開く","genre":"資源循環","forwho":"出費がかさむ保護者","why":"","summary":"入学・進級のタイミングに合わせるだけで需要がある。まだ使える制服や道具を次の人へ回す。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"PTAか学校に「制服のゆずり合い会をやりたい」と相談する","result":"出品点数と引き取られた点数","land":"","orgs":"","ref":"J4CE","refUrl":"https://j4ce.env.go.jp/casestudy/group/1/recycle/","summarySrc":"入学・進級のタイミングに合わせるだけで需要がある。保護者に確実に喜ばれる。","stepSrc":"PTAか学校に開催可否を相談する"},{"id":"A153","src":"事例200","title":"地域の生ごみを集めて堆肥にし、畑に戻す","genre":"資源循環","forwho":"地域の生ごみと畑","why":"","summary":"自宅だけで完結させず、近隣や飲食店の分まで受ける。畑に返るところまでを設計する。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"受け入れ先の畑を1か所確保する","result":"処理した量と、堆肥を使った農地の面積","land":"","orgs":"","ref":"環境省 地域循環共生圏","refUrl":"https://chiikijunkan.env.go.jp/"},{"id":"A154","src":"事例200","title":"廃食油を回収して燃料や石けんにする","genre":"資源循環","forwho":"処理に困る飲食店","why":"","summary":"飲食店には必ず出る。回収ルートを作れば地域の循環が1本できる。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"飲食店1軒に廃食油の処理方法を聞く","result":"回収量と、作った製品数","land":"","orgs":"","ref":"環境省 地域循環共生圏","refUrl":"https://chiikijunkan.env.go.jp/"},{"id":"A155","src":"事例200","title":"使わない道具のシェア倉庫を作る","genre":"資源循環","forwho":"年1回のために買う人","why":"","summary":"高圧洗浄機・草刈機・キャンプ道具。買わずに済む仕組みは歓迎される。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"自宅の年1回しか使わない道具を数える","result":"登録された道具数と貸出回数","land":"","orgs":"","ref":"J4CE","refUrl":"https://j4ce.env.go.jp/casestudy/group/1/recycle/"},{"id":"A156","src":"事例200","title":"事業所の紙・プラを分別して再資源化に回す","genre":"資源循環","forwho":"廃棄コストに悩む事業所","why":"","summary":"オフィス発の資源を回収し再製品化するサービスが実在する。導入は現実的。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"自分の職場のゴミを1週間分、分類する","result":"回収量と、削減した廃棄コスト","land":"","orgs":"","ref":"J4CE（オフィス資源のリサイクルサービス）","refUrl":"https://j4ce.env.go.jp/"},{"id":"A157","src":"事例200","title":"捨てにくいものの回収のしくみを調べて提案する","genre":"資源循環","forwho":"回収されない難処理品","why":"","summary":"紙おむつ・太陽光パネル・魔法びんなど、行政と企業が組んで回収を始めた例が出ている。","reach":"日本じゅうに","scale":"M","scaleLabel":"数人いると動く","step":"自分の市で「回収できません」とされている品目を確認する","result":"調べた品目数と、提案書1本","land":"","orgs":"","ref":"J4CE（加山興業×蒲郡市／サーモス回収サービス等）","refUrl":"https://j4ce.env.go.jp/","titleSrc":"地域の難処理品の回収スキームを調べて提案する","summarySrc":"紙おむつ・太陽光パネル・魔法びんなど、行政と企業が組む実証例が出ている。","stepSrc":"自分の市で回収困難とされている品目を確認"},{"id":"A158","src":"事例200","title":"服を回収して繕うワークショップを開く","genre":"資源循環","forwho":"直せずに捨てている人","why":"","summary":"捨てる前に直す文化を作る。手を動かすので参加者の満足度が高い。","reach":"自分のまち","scale":"S","scaleLabel":"ひとりでも始められる","step":"繕いができる人を1人見つける","result":"参加者数と、直した点数","land":"","orgs":"","ref":"J4CE","refUrl":"https://j4ce.env.go.jp/casestudy/group/1/recycle/"},{"id":"A159","src":"事例200","title":"団体や近隣の電気使用量を一緒に測って減らす","genre":"脱炭素・エネルギー","forwho":"電気代に悩む団体と世帯","why":"","summary":"公民館・お寺・商店・近所の家。自分の家だけでは何も変わらない。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"1か所に検針票12か月分を見せてもらう","result":"参加した拠点数と、合計の削減率","land":"","orgs":"","ref":"環境省 地域脱炭素取組事例集","refUrl":"https://policies.env.go.jp/policy/roadmap/assets/examples/chiiki-datsutanso-torikumi-jirei-202410.pdf"},{"id":"A160","src":"事例200","title":"屋根に太陽光を載せて発電量を公開する","genre":"脱炭素・エネルギー","forwho":"判断材料がない近隣","why":"","summary":"自分の家を実験場にして数字を出す。人に説明できる材料が手に入る。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"3社から見積もりを取る","result":"月間発電量と自家消費率","land":"","orgs":"","ref":"環境省 地域脱炭素取組事例集","refUrl":"https://policies.env.go.jp/policy/roadmap/assets/examples/chiiki-datsutanso-torikumi-jirei-202410.pdf"},{"id":"A161","src":"事例200","title":"高齢者宅の寒さ対策を1軒手伝う","genre":"脱炭素・エネルギー","forwho":"寒い家に住む高齢者","why":"","summary":"内窓・断熱シート・気密。ヒートショックは冬の死因に直結する。効果が室温で出る。","reach":"目の前のひとり","scale":"M","scaleLabel":"数人いると動く","step":"一番寒そうな家の脱衣所の温度を測る","result":"施工した軒数と、脱衣所の室温改善","land":"","orgs":"","ref":"環境省 地域脱炭素取組事例集","refUrl":"https://policies.env.go.jp/policy/roadmap/assets/examples/chiiki-datsutanso-torikumi-jirei-202410.pdf"},{"id":"A162","src":"事例200","title":"薪・ペレットを地域内で供給する仕組みを作る","genre":"脱炭素・エネルギー","forwho":"使われていない間伐材","why":"","summary":"森林整備と燃料が同時に回る。里山の手入れと接続しやすい。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"伐採で出る材の行き先を1件確認する","result":"供給量と利用世帯数","land":"","orgs":"","ref":"環境省 地域循環共生圏","refUrl":"https://chiikijunkan.env.go.jp/"},{"id":"A163","src":"事例200","title":"小水力・地熱・バイオマスの可能性を調べる","genre":"脱炭素・エネルギー","forwho":"眠ったままの地域資源","why":"","summary":"結論が「できない」でも構わない。調べた資料自体が地域の資産になる。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"地元の水路の落差と流量を1か所測る","result":"調査した候補地点数と報告書1本","land":"","orgs":"","ref":"環境省 地域脱炭素取組事例集","refUrl":"https://policies.env.go.jp/policy/roadmap/assets/examples/chiiki-datsutanso-torikumi-jirei-202410.pdf"},{"id":"A164","src":"事例200","title":"公民館・寺社・商店に省エネ診断を入れる","genre":"脱炭素・エネルギー","forwho":"経費に苦しむ施設","why":"","summary":"診断は無料・低額の制度がある。提案まで持っていけば感謝される。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"省エネ診断の実施機関を1件調べる","result":"診断件数と、提案した削減額","land":"","orgs":"","ref":"環境省 地域脱炭素取組事例集","refUrl":"https://policies.env.go.jp/policy/roadmap/assets/examples/chiiki-datsutanso-torikumi-jirei-202410.pdf"},{"id":"A165","src":"事例200","title":"EV・カーシェアを地域で1台回してみる","genre":"脱炭素・エネルギー","forwho":"移動手段がない住民","why":"","summary":"移動と脱炭素と高齢者の足が同時に動く。1台からでも検証になる。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"相乗り・カーシェアの法的な区分を確認","result":"利用回数と利用者数","land":"","orgs":"","ref":"環境省 地域脱炭素取組事例集","refUrl":"https://policies.env.go.jp/policy/roadmap/assets/examples/chiiki-datsutanso-torikumi-jirei-202410.pdf"},{"id":"A166","src":"事例200","title":"森林整備とクレジット化の可能性を調べる","genre":"脱炭素・エネルギー","forwho":"手入れされない森","why":"","summary":"山を持っている人・持てる人には現実的な選択肢。制度の理解が第一歩。","reach":"日本じゅうに","scale":"L","scaleLabel":"十数人か、許認可が要る","step":"地元の森林組合に1本問い合わせる","result":"調べた面積と、試算した吸収量","land":"","orgs":"","ref":"環境省 地域脱炭素取組事例集","refUrl":"https://policies.env.go.jp/policy/roadmap/assets/examples/chiiki-datsutanso-torikumi-jirei-202410.pdf"},{"id":"A167","src":"事例200","title":"高校生と組んで特産品を開発する","genre":"農山漁村","forwho":"出口が見えない高校生","why":"","summary":"高校が主役になった選定例が複数ある。学校と組むと継続性と発信力が付く。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"農業高校・水産高校に1校連絡する","result":"試作品数と、販売した数量","land":"","orgs":"","ref":"ディスカバー農山漁村の宝","refUrl":"https://www.maff.go.jp/j/nousin/kouryu/discover.html"},{"id":"A168","src":"事例200","title":"農泊で1組だけ受け入れてみる","genre":"農山漁村","forwho":"泊まる場所がない来訪者","why":"","summary":"制度も支援もある分野。まず1組泊めてみると必要なものが全部わかる。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"農泊の届出・許可の要件を調べる","result":"受入組数と感想","land":"","orgs":"","ref":"農林水産省 農泊／ディスカバー農山漁村の宝","refUrl":"https://www.maff.go.jp/j/nousin/kouryu/discover.html"},{"id":"A169","src":"事例200","title":"しかやいのししを、解体から料理まで通しで体験する","genre":"農山漁村","forwho":"鳥獣被害に苦しむ農家","why":"","summary":"畑を荒らす鳥獣という深刻な問題と、食と、狩猟が1本でつながる。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"地元の猟友会か、市の鳥獣被害の担当に連絡する","result":"参加回数と、扱った頭数","land":"","orgs":"","ref":"農林水産省 ジビエ利用拡大","refUrl":"https://www.maff.go.jp/","titleSrc":"ジビエを解体から料理まで通しで体験する","summarySrc":"鳥獣被害という深刻な課題と、食と、狩猟が一本でつながる。","stepSrc":"地元の猟友会か市の鳥獣担当に連絡する"},{"id":"A170","src":"事例200","title":"棚田のオーナー制度に入る／作る","genre":"農山漁村","forwho":"維持できなくなる棚田","why":"","summary":"都市の人が田を持てる仕組み。参加する側なら今週から動ける。","reach":"日本じゅうに","scale":"M","scaleLabel":"数人いると動く","step":"近隣の棚田オーナー制度を3件調べる","result":"参加した面積と収穫量","land":"","orgs":"","ref":"農林水産省 棚田振興","refUrl":"https://www.maff.go.jp/"},{"id":"A171","src":"事例200","title":"空き農地でマルシェ・直売を月1回開く","genre":"農山漁村","forwho":"売り先がない生産者","why":"","summary":"作る人と買う人を直接つなぐ。売上という結果がその日に出る。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"出店してくれる生産者を3人集める","result":"出店者数と売上","land":"","orgs":"","ref":"ディスカバー農山漁村の宝","refUrl":"https://www.maff.go.jp/j/nousin/kouryu/discover.html"},{"id":"A172","src":"事例200","title":"作る→加工する→売るを一人で通してみる","genre":"農山漁村","forwho":"買い叩かれる一次産業","why":"","summary":"規模は小さくてよい。全工程を一度通すと構造が体でわかる。","reach":"日本じゅうに","scale":"M","scaleLabel":"数人いると動く","step":"一番作りやすい一次産品を1つ決める","result":"製造ロット数と販売額","land":"","orgs":"","ref":"ディスカバー農山漁村の宝","refUrl":"https://www.maff.go.jp/j/nousin/kouryu/discover.html"},{"id":"A173","src":"事例200","title":"浜の朝市・直売所を手伝って発信する","genre":"農山漁村","forwho":"担い手不足の朝市","why":"","summary":"主催しなくてよい。撮って書いて出すだけで、担い手不足の現場は助かる。","reach":"自分のまち","scale":"S","scaleLabel":"ひとりでも始められる","step":"近隣の朝市の開催日を調べて行く","result":"手伝った回数と、投稿の反応数","land":"","orgs":"","ref":"ディスカバー農山漁村の宝","refUrl":"https://www.maff.go.jp/j/nousin/kouryu/discover.html"},{"id":"A174","src":"事例200","title":"集落のこれからを住民で話し合う場を作る","genre":"農山漁村","forwho":"将来像を描けない集落","why":"","summary":"農村RMO（集落をまとめて支える組織）という国の枠組みがある。話し合いの記録そのものが成果になる。","reach":"自分のまち","scale":"L","scaleLabel":"十数人か、許認可が要る","step":"自分の集落の世帯数と年齢の構成を調べる","result":"参加世帯数と、まとめた将来像1本","land":"","orgs":"","ref":"農林水産省 農村RMO","refUrl":"https://www.maff.go.jp/","titleSrc":"集落の将来像を住民で話し合う場を作る","summarySrc":"農村RMOという枠組みがある。話し合いの記録そのものが成果物になる。","stepSrc":"集落の世帯数と年齢構成を調べる"},{"id":"A175","src":"事例200","title":"耕作放棄地に果樹を植える","genre":"農山漁村","forwho":"荒れたままの農地","why":"","summary":"収穫まで数年かかるが、植えた本数は初日から成果として残る。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"農地の権利関係を農業委員会で確認","result":"植えた本数と活着率","land":"","orgs":"","ref":"農林水産省 荒廃農地対策","refUrl":"https://www.maff.go.jp/"},{"id":"A176","src":"事例200","title":"地域の埋もれた活動を、表彰制度に推薦・応募代行する","genre":"農山漁村","forwho":"埋もれている地域の活動","why":"","summary":"書類が書けないせいで評価されていない団体は多い。書く役を引き受ける。","reach":"自分のまち","scale":"S","scaleLabel":"ひとりでも始められる","step":"推したい団体を1つ決めて話を聞く","result":"応募を代行した件数と、選定された数","land":"","orgs":"","ref":"ディスカバー農山漁村の宝（個人部門）","refUrl":"https://www.maff.go.jp/j/nousin/kouryu/discover.html"},{"id":"A177","src":"事例200","title":"有名観光地がない町で体験型コンテンツを作る","genre":"観光・関係人口","forwho":"観光資源がないとされた町","why":"","summary":"「何もない」前提から始めた協議会が、年間100人規模の体験を運営している例がある。","reach":"自分のまち","scale":"M","scaleLabel":"数人いると動く","step":"地元の川・山・道から素材を3つ挙げる","result":"造成したコンテンツ数と体験者数","land":"","orgs":"","ref":"手づくり郷土賞R6（サードプレイスツーリズム協議会・福知山市）","refUrl":"https://www.mlit.go.jp/sogoseisaku/region/tedukuri/gaiyo/main_r6.html"},{"id":"A178","src":"事例200","title":"地元の職人を案内役にした体験を売る","ge mary":"対話を重ね、SDGs推進パートナー制度を基盤に、棚田米の日本酒、荒廃みかん園での放牧、資源循環などを事業化","step":"まず地域行事や清掃に参加し、課題を聞く。課題と協力希望を一覧化してマッチング会を開く","result":"パートナー制度に多数の団体が参加。生まれた事業の一部は行政支援なしで継続し、利益の一部を干潟保全に還元","orgs":"鹿島市、地域住民、農漁業者、酒蔵、金融機関、企業、デザイナー等","url":"https://chiikijunkan.env.go.jp/assets/pdf/tsukuru/seminar/2024/seminar_01_report.pdf"},{"id":"C002","title":"コウノトリがつなぐ地域の輪（徳島県鳴門市）","genre":["川・水辺・海","食・農","地域ブランド・知財"],"summary":"コウノトリを共通テーマに、生息環境保全、環境配慮型農業、普及啓発、地域商品の展開を連携","step":"象徴となる地域資源を1つ定め、関係者ごとのメリットを整理して小規模企画から開始","result":"環境保全と地域活性化を結ぶネットワーク形成の事例として環境省が紹介","orgs":"NPO・地域団体、農業者、自治体、大学・専門家、企業、住民","url":"https://chiikijunkan.env.go.jp/shiru/interview/tokushima-naruto/"},{"id":"C003","title":"全額市民出資による市民共同太陽光発電所（奈良県生駒市）","genre":["脱炭素・エネルギー"],"summary":"市民から出資を募り、公共・地域施設等に共同太陽光発電設備を設置・運営","step":"まずは出資ではなく、協力施設・参加希望者・電力利用先のニーズ調査から始める","result":"市民が資金面から参加する地域エネルギー事業として環境大臣賞の優秀賞を受賞","orgs":"一般社団法人市民エネルギー生駒、市民、施設所有者、自治体等","url":"https://www.env.go.jp/policy/kihon_keikaku/goodlifeaward/report/201703_02/"},{"id":"C004","title":"霞ヶ浦の水辺環境再生（茨城県美浦村）","genre":["川・水辺・海"],"summary":"月2回の草刈り・伐採・清掃、生物調査、植生浄化施設管理、親子向け環境学習","step":"対象エリアを狭く設定し、定例清掃と観察記録をセットで開始","result":"継続的な環境管理と学習機会を両立し、水辺利用と地域活性化にも寄与","orgs":"NPO法人水辺基盤協会、地域住民、親子、自治体・関係機関","url":"https://www.mlit.go.jp/sogoseisaku/region/tedukuri/gaiyo/main_r6.html"},{"id":"C005","title":"ニッコウイワナ復活プロジェクト（栃木県日光市）","genre":["子ども・教育"],"summary":"生態調査、増殖、生息環境保全、学校・家庭を巻き込んだ観察と放流","step":"専門家と学校を1校ずつ確保し、調査・体験・発表の小さな年間プログラムを作る","result":"市民・研究者・学校の協働が定着し、環境学習を通じて活動の次世代化を推進","orgs":"ニッコウイワナに学ぶ会、研究所、行政、企業、小学校、親子","url":"https://www.mlit.go.jp/sogoseisaku/region/tedukuri/gaiyo/main_r6.html"},{"id":"C006","title":"馬入水辺の楽校（神奈川県平塚市）","genre":["川・水辺・海","農山漁村","子ども・教育"],"summary":"ごみ処理と自然復元を起点に、環境管理、自然体験、年間多数の環境学習活動を実施","step":"遊休地・水辺の所有管理者と合意し、月1回の整備＋体験会から始める","result":"参加者が増加し、自然保護・教育・地域交流の拠点として継続","orgs":"NPO法人暮らし・つながる森里川海、市民、子ども、行政","url":"https://www.mlit.go.jp/sogoseisaku/region/tedukuri/gaiyo/main_r6.html"},{"id":"C007","title":"矢田川・庄内川をきれいにする会（愛知県名古屋市ほか）","genre":["川・水辺・海","子ども・教育"],"summary":"清掃、魚類調査、釣り大会、ビオトープ活用、環境学習を半世紀にわたり継続","step":"清掃だけでなく、年1回の象徴イベントと子ども向け調査を設計","result":"多世代の住民が参加する活動へ成長し、環境改善と地域コミュニティ形成に寄与","orgs":"矢田・庄内川をきれいにする会、地域住民、子ども、学校等","url":"https://www.mlit.go.jp/sogoseisaku/region/tedukuri/gaiyo/main_r6.html"},{"id":"C008","title":"木の岡ビオトープ（滋賀県大津市）","genre":["川・水辺・海","農山漁村","子ども・教育"],"summary":"除草・清掃・竹林管理、散策路整備、自然観察会を住民と専門家で運営","step":"専門家を交えた季節ごとの観察会と保全作業をセットにする","result":"保全活動と観察会が新規参加者同士の交流機会として機能","orgs":"おにぐるみの学校、専門家、地域住民、小学校、行政","url":"https://www.mlit.go.jp/sogoseisaku/region/tedukuri/gaiyo/main_r6.html"},{"id":"C009","title":"アザメの瀬の保全（佐賀県唐津市）","genre":["川・水辺・海","食・農","子ども・教育"],"summary":"水生生物調査、田植え、魚取り、自然観察、米の子ども食堂寄贈、防災教育","step":"学校の年間行事に組み込める3～4回の体験プログラムを設計","result":"小学校との連携が20年以上続き、国内外から視察を受ける地域学習拠点に発展","orgs":"NPO法人アザメの会、地元小学校、住民、唐津市、視察者","url":"https://www.mlit.go.jp/sogoseisaku/region/tedukuri/gaiyo/main_r6.html"},{"id":"C010","title":"登録有形文化財を活用した真壁のまちづくり（茨城県桜川市）","genre":["川・水辺・海","子ども・教育","歴史・文化"],"summary":"町並み案内、所有者と調整した建物公開、子どもの作品展、まち歩き","step":"地域資源マップを作り、所有者3～5軒と限定公開・案内ツアーを試す","result":"来街者と所有者の交流を生み、住民にも地域の魅力を再発見する機会を創出","orgs":"ディスカバーまかべ、街並み案内ボランティア、建物所有者、子ども、行政","url":"https://www.mlit.go.jp/sogoseisaku/region/tedukuri/gaiyo/main_r6.html"},{"id":"C011","title":"サードプレイスツーリズム（京都府福知山市）","genre":["川・水辺・海","道・橋・インフラ","観光・関係人口"],"summary":"河川・山・道路・職人を組み合わせた体験型観光コンテンツを造成・販売し、専用サイトで発信","step":"地域の人・技・場所を棚卸しし、90分程度の有料体験を1本試作","result":"地域固有の体験商品を造成し、有料体験として域外客を受け入れ","orgs":"サードプレイスツーリズム協議会、地元職人、観光事業者、自治体等","url":"https://www.mlit.go.jp/sogoseisaku/region/tedukuri/gaiyo/main_r6.html"},{"id":"C012","title":"国道29号沿線活性化（鳥取県若桜町・八頭町ほか）","genre":["歴史・文化"],"summary":"花植え、清掃、景観形成、地域の魅力発信マップ、歴史を学ぶ街歩き","step":"道路・川・鉄道など共通の線をテーマに、複数地域の合同活動を1回実施","result":"少人数の活動から長期継続し、子ども・住民を巻き込んだ沿線活動へ展開","orgs":"R29活性化委員会、地域住民、小学生、沿線自治体等","url":"https://www.mlit.go.jp/sogoseisaku/region/tedukuri/gaiyo/main_r6.html"},{"id":"C013","title":"ながと大内湯けむり街道（山口県長門市）","genre":["歴史・文化"],"summary":"二つの温泉地区を街道で結び、清掃、文化継承、地域連携イベントを継続","step":"隣接チーム同士で共通ストーリーをつくり、周遊イベントを共同開催","result":"地区を越えた交流の場となり、来訪者・関係人口の拡大に寄与","orgs":"ながと大内湯けむり街道協議会、4地域団体、住民、自治体等","url":"https://www.mlit.go.jp/sogoseisaku/region/tedukuri/gaiyo/main_r6.html"},{"id":"C014","title":"奈半利町ふるさと海岸の地域振興（高知県奈半利町）","genre":["川・水辺・海","子ども・教育"],"summary":"海岸清掃と子ども向けトライアスロンを組み合わせ、地域全体で来訪者を受け入れ","step":"既存公共空間を使い、清掃日と小規模スポーツ・体験イベントを連動","result":"大会参加者が拡大し、イベント前の住民清掃参加も活発化","orgs":"奈半利町みなと未来会議、一般社団法人なはりの郷、地域住民、子ども、自治体","url":"https://www.mlit.go.jp/sogoseisaku/region/tedukuri/gaiyo/main_r6.html"},{"id":"C015","title":"犀川大橋の地域連携（石川県金沢市）","genre":["川・水辺・海","歴史・文化"],"summary":"月例清掃、リバーカフェ、水辺イベント、勉強会、架橋100年祝祭を継続","step":"地域の象徴物を決め、清掃＋小さな滞在イベントを定例化","result":"記念事業には約1万5千人が来場し、シビックプライド醸成の契機に","orgs":"金沢片町まちづくり会議、地域住民、商業者、行政等","url":"https://www.mlit.go.jp/sogoseisaku/region/tedukuri/gaiyo/main_r6.html"},{"id":"C016","title":"紀の川じるし・森里海連携（奈良県川上村ほか）","genre":["川・水辺・海","農山漁村","地域ブランド・知財"],"summary":"流域を共通ブランドで結び、森里海の保全と地域産品・産業の発信を連動","step":"同じ川・山系に属するチームをつなぎ、共通ロゴ・企画・販売会を試す","result":"県境を越えた環境・産業連携事例としてグッドライフ特別賞を受賞","orgs":"公益財団法人吉野川紀の川源流物語、流域住民、事業者、自治体等","url":"https://www.env.go.jp/policy/kihon_keikaku/goodlifeaward/report/index.html"},{"id":"C017","title":"移動スーパーとくし丸（徳島県発・全国）","genre":["高齢者・ケア"],"summary":"移動販売を地域スーパーと個人事業者の連携モデルで展開し、買い物と見守りを一体化","step":"対象地区で買い物困難者と既存店舗を調査し、予約型・巡回型の小規模実証を行う","result":"生活課題と持続可能な事業を両立する取組としてグッドライフアワード優秀賞を受賞","orgs":"株式会社とくし丸、地域スーパー、販売パートナー、利用者、自治体等","url":"https://www.env.go.jp/policy/kihon_keikaku/goodlifeaward/report/index.html"},{"id":"C018","title":"企業による循環型ビジネス事例（J4CE）","genre":["資源循環"],"summary":"リサイクル、再利用、製品長寿命化、シェアリングなどの事例を分野別に共有","step":"地域企業2～3社の廃棄物と原材料ニーズを聞き、交換可能性を可視化","result":"多数の企業事例を取組類型別に検索・比較できるプラットフォームとして運営","orgs":"企業、業界団体、環境省、経済産業省、日本経済団体連合会等","url":"https://j4ce.env.go.jp/casestudy/group/1/recycle/"},{"id":"C019","title":"公共交通を軸としたコンパクトシティ（富山県富山市）","genre":["道・橋・インフラ","高齢者・ケア"],"summary":"鉄軌道と高頻度バスを公共交通軸に定め、沿線への居住を支援。LRT、環状線、高齢者向け運賃施策を組み合わせた","step":"地域の駅・バス停と生活施設を地図化し、利用者ヒアリングと徒 /* ── 設問（5画面）───────────────────────────────────
   やってみたいことは3段階。いきなり26分野から選ばせると粒度がばらばらで
   選べないので、大きく6つ → 分野 → プロジェクト の順に絞る。
   選択肢に出す「たとえば」は一歩目ではなくプロジェクト名にする
   （一歩目は役所の手続きの話が多く、分野とずれて見えるため）。 ── */
function shortlist(){
  /* 選んだ分野から、実際の候補を作る。分野ごとに1つずつ拾ってから埋める */
  var pool = DB.items.filter(function(it){ return A.genre.indexOf(it.genre) >= 0; })
    .sort(function(x, y){
      var sx = SCALE_ORDER[x.scale], sy = SCALE_ORDER[y.scale];
      if (sx !== sy) return sx - sy;
      if (!!y.orgs !== !!x.orgs) return (y.orgs ? 1 : 0) - (x.orgs ? 1 : 0);
      return x.id < y.id ? -1 : 1;
    });
  var out = [], seen = {};
  /* 分野が1つだけでも8件出るよう、回す数を分野数に合わせる */
  var rounds = Math.max(1, Math.ceil(8 / Math.max(1, A.genre.length)));
  for (var round = 0; round < rounds; round++) {
    A.genre.forEach(function(g){
      for (var i = 0; i < pool.length; i++) {
        if (seen[pool[i].id] || pool[i].genre !== g) continue;
        out.push(pool[i]); seen[pool[i].id] = 1; return;   /* 各分野から1つずつ */
      }
    });
  }
  return out.slice(0, 8);
}

/* ── 色 ─────────────────────────────────────────── */
function hue(i){
  return i >= 0
    ? "--c:var(--h" + i + ",var(--accent));--cv:var(--h" + i + "v,var(--accent))"
    : "--c:var(--accent);--cv:var(--accent)";
}
function genreIndex(name){
  for (var i = 0; i < DB.genres.length; i++) if (DB.genres[i].name === name) return i;
  return -1;
}
function genreHue(name){ return hue(genreIndex(name)); }

function prune(){
