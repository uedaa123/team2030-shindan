<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>チーム2030 プロジェクト診断</title>
<!-- オフライン配布版（build.mjs が自動生成）。直接編集しないこと。
     直すのは assets/ と data/ の側。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700&display=swap">
<style>
/* チーム2030 プロジェクト診断
   ── 配色の考え方 ──────────────────────────────────
   分野11項目に、それぞれ固有の色を割り当てている（--h0〜--h10、
   data/cases.json の genres の並び順）。選んだ分野の色が、そのまま結果画面の
   カードの上辺に出る。色は飾りではなく、自分が何を選んだかの目印。
   勇誠義礼の4タイプにも固有色がある（勇＝朱、誠＝青、義＝橙、礼＝桃）。
   色の指定は --c（文字用の濃い側）と --cv（塗り用の鮮やかな側）を
   各要素に流し込む形に統一してある。分野を増やすときは --h11 / --h11v を足すだけ。 */

:root{
  /* 分野11色（data/cases.json の genres と同じ順） */
  --h0:#d9700a;  /* 子どもと学び          橙 */
  --h1:#1d7fc2;  /* 水辺と生きもの        青 */
  --h2:#5f8f18;  /* 里山・森・畑          黄緑 */
  --h3:#8438c9;  /* 記録して残す          紫 */
  --h4:#e8471f;  /* まちと空き家          朱 */
  --h5:#b07d00;  /* 地域の稼ぎをつくる    黄 */
  --h6:#159a5c;  /* ごみを資源に戻す      緑 */
  --h7:#4a4cdb;  /* 仕組みをつくる        藍 */
  --h8:#00867c;  /* 年を重ねても動ける    青緑 */
  --h9:#d62d72;  /* だれも外れない        桃 */
  --h10:#8a5a2b; /* いざというときに備える 土 */

  /* 同じ10色の、塗り用の鮮やかな側。--hN は文字にも使うので白地で読める濃さに
     抑えてある。面で見せるところ（カードの上辺・丸・バー）は --hNv を使う。 */
  --h0v:#fb8b1e; --h1v:#2fa3e8; --h2v:#84cc16; --h3v:#a855f7; --h4v:#ff5a2d;
  --h5v:#fbbf24; --h6v:#18c26e; --h7v:#6366f1; --h8v:#00c2b2; --h9v:#f43f8e;
  --h10v:#c08457;

  /* 勇誠義礼 */
  --yu:#e8471f; --sei:#1d7fc2; --gi:#d9700a; --rei:#d62d72;

  --accent:#e8471f;
  --accent-soft:#fdeee9;

  /* 下地。純グレーではなく、濃紺に寄せた中間色 */
  --ink:#22263d;
  --ink-2:#59607a;
  --paper:#f4f6fa;
  --card:#ffffff;
  --deep:#20233f;
  --line:#d9deea;
  --line-2:#eaeef6;

  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",
            "Noto Sans JP",system-ui,sans-serif;
  --gothic:"Hiragino Sans","Yu Gothic","Noto Sans JP","Meiryo",system-ui,sans-serif;

  --r:14px;   /* カードの丸み */
  --r-s:10px; /* ボタンの丸み */
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --h0:#ffa049; --h1:#4fb3f0; --h2:#9fd13f; --h3:#bb7bf5; --h4:#ff7a55;
    --h5:#f0bd3a; --h6:#3ed294; --h7:#8f91ff; --h8:#2ebfb2; --h9:#ff6fa3; --h10:#c99a6d;
    --h0v:#ffa049; --h1v:#4fb3f0; --h2v:#9fd13f; --h3v:#bb7bf5; --h4v:#ff7a55;
    --h5v:#f0bd3a; --h6v:#3ed294; --h7v:#8f91ff; --h8v:#2ebfb2; --h9v:#ff6fa3; --h10v:#c99a6d;
    --yu:#ff7a55; --sei:#4fb3f0; --gi:#ffa049; --rei:#ff6fa3;
    --accent:#ff7a55; --accent-soft:#33221d;
    --ink:#e9ecf6; --ink-2:#a2aac4; --paper:#12142a; --card:#1c1f38;
    --deep:#0c0e20; --line:#333856; --line-2:#272b46;
  }
}
:root[data-theme="dark"]{
  --h0:#ffa049; --h1:#4fb3f0; --h2:#9fd13f; --h3:#bb7bf5; --h4:#ff7a55;
  --h5:#f0bd3a; --h6:#3ed294; --h7:#8f91ff; --h8:#2ebfb2; --h9:#ff6fa3; --h10:#c99a6d;
  --h0v:#ffa049; --h1v:#4fb3f0; --h2v:#9fd13f; --h3v:#bb7bf5; --h4v:#ff7a55;
  --h5v:#f0bd3a; --h6v:#3ed294; --h7v:#8f91ff; --h8v:#2ebfb2; --h9v:#ff6fa3; --h10v:#c99a6d;
  --yu:#ff7a55; --sei:#4fb3f0; --gi:#ffa049; --rei:#ff6fa3;
  --accent:#ff7a55; --accent-soft:#33221d;
  --ink:#e9ecf6; --ink-2:#a2aac4; --paper:#12142a; --card:#1c1f38;
  --deep:#0c0e20; --line:#333856; --line-2:#272b46;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--gothic);
     font-size:15px;line-height:1.8;-webkit-font-smoothing:antialiased;
     -webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 96px}
.wrap#app{padding-bottom:calc(96px + env(safe-area-inset-bottom))}

/* ── ヘッダー ──────────────────────────────────── */
header{background:var(--deep);color:#fff;padding:0 0 40px}
/* 11色の帯。このツールが扱う分野の数だけ色がある */
header:before{content:"";display:block;height:7px;
  background:linear-gradient(90deg,
    var(--h0v) 0 9.09%, var(--h1v) 9.09% 18.2%, var(--h2v) 18.2% 27.3%,
    var(--h3v) 27.3% 36.4%, var(--h4v) 36.4% 45.5%, var(--h5v) 45.5% 54.5%,
    var(--h6v) 54.5% 63.6%, var(--h7v) 63.6% 72.7%, var(--h8v) 72.7% 81.8%,
    var(--h9v) 81.8% 90.9%, var(--h10v) 90.9% 100%)}
header .wrap{padding-top:40px;padding-bottom:0}
h1{font-family:var(--display);font-weight:700;font-size:38px;line-height:1.3;
   margin:0 0 14px;letter-spacing:.01em;text-wrap:balance}
header p{margin:0;color:#b8bfdc;font-size:14px;line-height:1.85;max-width:52ch}
@media(max-width:560px){
  header{padding-bottom:28px}
  header .wrap{padding-top:28px}
  h1{font-size:29px}
}

/* 進捗バー。進むほど色数が増える */
.bar{height:5px;background:var(--line-2);position:sticky;top:0;z-index:5}
.bar i{display:block;height:100%;width:0;transition:width .35s ease;
  background:linear-gradient(90deg,var(--h0v),var(--h8v) 45%,var(--h3v) 70%,var(--h4v));
  background-size:760px 100%;background-repeat:no-repeat}

/* ── 設問 ──────────────────────────────────────── */
.step{padding:40px 0 0}
.stepno{font-family:var(--display);font-weight:700;font-size:12px;color:var(--accent);
  margin:0 0 8px;letter-spacing:.14em}
h2{font-family:var(--display);font-weight:700;font-size:25px;line-height:1.5;
   margin:0 0 8px;text-wrap:balance}
@media(max-width:560px){.step{padding:28px 0 0}h2{font-size:22px}}
.hint{color:var(--ink-2);font-size:13px;margin:0 0 22px}

.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
@media(max-width:560px){.opts.two{grid-template-columns:1fr}}

button.opt{font:inherit;text-align:left;background:var(--card);
  border:2px solid var(--line);border-radius:var(--r-s);
  padding:14px 16px;cursor:pointer;color:var(--ink);min-height:50px;
  transition:border-color .13s,background .13s,transform .09s}
button.opt:hover{border-color:var(--c,var(--accent))}
button.opt:active{transform:scale(.99)}
button.opt:focus-visible{outline:3px solid var(--c,var(--accent));outline-offset:2px}
button.opt.on{border-color:var(--c,var(--accent));
  background:color-mix(in srgb,var(--cv,var(--c,var(--accent))) 12%,var(--card))}
button.opt.off{opacity:.45}
button.opt b{display:block;font-weight:700;font-family:var(--display)}
button.opt span{display:block;font-size:12.5px;color:var(--ink-2);margin-top:3px;
  line-height:1.7;font-family:var(--gothic)}

/* 色を持つ選択肢（分野・勇誠義礼）は、色の丸を先頭に出す */
button.opt.hue{display:flex;gap:11px;align-items:flex-start}
button.opt.hue:before{content:"";flex:0 0 auto;width:15px;height:15px;border-radius:50%;
  background:var(--cv,var(--c));margin-top:5px;transition:box-shadow .13s}
button.opt.hue.on:before{box-shadow:0 0 0 4px color-mix(in srgb,var(--cv,var(--c)) 30%,transparent)}

.nav{display:flex;gap:12px;align-items:center;margin-top:28px;flex-wrap:wrap}
.go{font:inherit;font-family:var(--display);font-weight:700;background:var(--accent);
    color:#fff;border:0;border-radius:var(--r-s);padding:14px 28px;cursor:pointer;
    min-height:50px;transition:filter .13s,transform .09s}
.go:hover{filter:brightness(1.08)}
.go:active{transform:scale(.99)}
.go:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.go[disabled]{background:var(--line);color:var(--ink-2);cursor:not-allowed;filter:none}
.back{font:inherit;background:none;border:0;color:var(--ink-2);cursor:pointer;
      text-decoration:underline;padding:12px 4px;min-height:50px}
.back:hover{color:var(--ink)}
.back:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.count{font-size:12.5px;color:var(--ink-2);margin-left:auto;
  font-variant-numeric:tabular-nums}

/* ── 結果 ──────────────────────────────────────── */
.res{padding:36px 0 0}
.lede{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.6;
  margin:0 0 14px;text-wrap:balance}
.recap{font-size:12.5px;color:var(--ink-2);background:var(--card);
  border:2px solid var(--line-2);border-radius:var(--r-s);
  padding:13px 15px;margin:0 0 22px;line-height:1.9}
.recap b{color:var(--ink);font-weight:700}

/* カード。上辺の色は、その分野の色 */
article{background:var(--card);border:1px solid var(--line-2);
  border-top:6px solid var(--cv,var(--c,var(--line)));
  border-radius:var(--r);padding:20px 20px 18px;margin-bottom:14px}
article.top{box-shadow:0 2px 0 0 var(--line-2),0 10px 26px -18px var(--ink)}
.rank{font-family:var(--display);font-weight:700;font-size:11.5px;
  color:var(--c,var(--ink-2));margin:0 0 4px;letter-spacing:.06em}
h3{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.5;margin:0 0 10px;
   text-wrap:balance}
dl{margin:0;display:grid;grid-template-columns:6.5em 1fr;gap:8px 14px;font-size:13.5px}
@media(max-width:560px){dl{grid-template-columns:1fr;gap:2px 0}dl dt{margin-top:11px}}
dt{font-family:var(--display);font-weight:700;color:var(--ink-2);font-size:12px;padding-top:3px}
dd{margin:0;line-height:1.8}
.src{font-size:12px;margin-top:13px}
.src a{color:var(--c,var(--accent))}

h4.sec{font-family:var(--display);font-weight:700;font-size:19px;margin:38px 0 4px}

/* ── 解説ブロック ─────────────────────────────── */
section.block{margin:36px 0 0;padding:24px 22px;border-radius:var(--r);
  background:var(--card);border:1px solid var(--line-2);
  border-top:6px solid var(--cv,var(--c,var(--accent)))}
section.block h4{font-family:var(--display);font-weight:700;font-size:19px;
  margin:0 0 10px;color:var(--ink);text-wrap:balance}
section.block p{margin:0 0 10px;font-size:13.5px;color:var(--ink-2);line-height:1.85}
section.block .pair{background:color-mix(in srgb,var(--c,var(--accent)) 7%,var(--card));
  border-radius:var(--r-s);padding:13px 15px;margin:11px 0 0;font-size:13.5px;
  line-height:1.85}
section.block .pair b{color:var(--ink);font-family:var(--display);font-weight:700}

/* 「あなたの入り方」。結果画面のいちばん上に来る、このツールの主役 */
section.me{background:var(--deep);border-color:var(--deep);color:#eef0fa;margin:0 0 30px}
section.me h4{color:#fff;font-size:21px}
section.me .mesub{font-size:12px;color:#8f9ac4;letter-spacing:.04em;margin:0 0 14px}
section.me .melead{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.75;
  color:#fff;margin:0}
section.me .pair{background:rgba(255,255,255,.09)}
section.me .pair b{color:#fff}
@media(max-width:560px){
  section.me h4{font-size:19px}
  section.me .melead{font-size:16px}
}

/* 「ひとりでやらない」は薄い地。主役は上の me なので、ここは静かにする */
section.wd{border-top-color:var(--ink-2)}
section.wd .pair{background:var(--paper)}

/* 大義。プロジェクトが何をもたらすのか */
.cause{font-size:13.5px;color:var(--c,var(--ink-2));font-weight:700;
  margin:0 0 14px;line-height:1.75}
dd.strong{font-family:var(--display);font-weight:700;font-size:15px;line-height:1.7}
.dim{font-size:12.5px;opacity:.75}

/* もう動いている場所（実在事例）。おすすめとは別の見え方にする */
article.real{border-style:dashed;border-width:1px;border-top-style:solid;border-top-width:6px;
  background:var(--paper)}

.note{font-size:12px;color:var(--ink-2);border-left:3px solid var(--cv,var(--c,var(--accent)));
  padding:8px 0 8px 13px;margin:18px 0 0;line-height:1.85}
section.me .note{color:#b8bfdc}
.restart{margin-top:34px}
.restart .go{background:var(--ink)}

/* ── 次の行動へ：コピーカード ───────────────────── */
.act{background:var(--card);border:2px solid var(--accent);border-radius:var(--r);
     padding:20px;margin:0 0 30px}
.act.tail{margin:36px 0 0}
.act h4{font-family:var(--display);font-weight:700;font-size:18px;margin:0 0 8px;
  text-wrap:balance}
.act p{font-size:12.5px;color:var(--ink-2);margin:0 0 14px;line-height:1.85}
.act .go{width:100%;text-align:center}
.act .go.done{background:var(--h3)}
.namefield{margin:0 0 14px}
.namefield label{display:block;font-size:12.5px;color:var(--ink-2);margin:0 0 6px}
.namefield input{font:inherit;width:100%;padding:12px 13px;border:2px solid var(--line);
  border-radius:var(--r-s);background:var(--paper);color:var(--ink);min-height:48px}
.namefield input:focus-visible{outline:3px solid var(--accent);outline-offset:1px;
  border-color:var(--accent)}
.copied{font-size:12.5px;color:var(--accent);font-weight:700;margin:11px 0 0;min-height:1.5em;
  line-height:1.7}
pre.preview{font-family:var(--gothic);font-size:12px;line-height:1.85;background:var(--paper);
  border-radius:var(--r-s);padding:14px;margin:12px 0 0;
  white-space:pre-wrap;word-break:break-word;color:var(--ink-2);max-height:15em;overflow:auto}
details.previewbox{margin:13px 0 0}
details.previewbox summary{font-size:12.5px;color:var(--ink-2);cursor:pointer;
  padding:4px 0}
details.previewbox summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px;
  border-radius:4px}

/* ── 読み込み失敗 ─────────────────────────────── */
.oops{background:var(--card);border:2px solid var(--accent);border-radius:var(--r);
  padding:22px;margin:40px 0 0}
.oops h2{font-size:20px;margin:0 0 10px}
.oops p{font-size:13.5px;color:var(--ink-2);margin:0 0 10px;line-height:1.85}
.oops code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;
  background:var(--paper);padding:2px 6px;border-radius:5px}

/* 自動コピーが使えないブラウザ向けの控え。
   opacity:0 や display:none にすると execCommand("copy") が効かない端末があるので、
   位置だけで画面外へ逃がす。 */
#fallbackpad{position:fixed;left:-9999px;top:0;width:1px;height:1px;
  border:0;padding:0;font-size:16px;pointer-events:none}

@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{transition-duration:.01ms !important;animation-duration:.01ms !important}
}

</style>
</head>
<body>

<header><div class="wrap">
<h1>プロジェクト診断</h1>
<p>気になる分野を選ぶと、今週から始められるプロジェクトが出てきます。あなたの性格に合った「入り方」と、すでに動いている場所への飛び込み方つき。</p>
</div></header>

<div class="bar"><i id="bar"></i></div>

<main class="wrap" id="app" aria-live="polite"></main>

<textarea id="fallbackpad" aria-hidden="true" tabindex="-1"></textarea>

<script>/* チーム2030 プロジェクト診断 ／ 運営が触る設定はこのファイルだけ
   ここを書き換えても、assets/app.js と data/cases.json は触らなくてよい */
window.T2030_CONFIG = {

  /* 事例データの場所。差し替えるときは data/cases.json を上書きするだけでよい */
  dataUrl: "data/cases.json",

  /* 回答をスプレッドシートに貯めるなら、GASのウェブアプリURLをここに貼る。
     空のままなら送信は一切行わない（ツールは普通に動く）。
     GASの中身は tools/gas-endpoint.gs にある。 */
  logEndpoint: "",

  /* GAS側で SECRET を設定したときだけ、同じ文字列をここにも入れる */
  logSecret: "",

  /* 質問の本数。"full" = 7問（2週目の仮プロジェクト決め用）
                  "short" = 3問（キックオフでその場で触らせる用）
     URLに ?q=3 を付けると、この設定にかかわらず3問版になる。
     ※どちらを使うかは運営未確定（引継ぎ資料 §8-⑤） */
  questionSet: "full",

  /* 結果画面に「Discordの表示名」欄を出すか。logEndpoint が空なら自動的に出ない */
  askName: true

function hue(i){
  return i >= 0
    ? "--c:var(--h" + i + ",var(--accent));--cv:var(--h" + i + "v,var(--accent))"
    : "--c:var(--accent);--cv:var(--accent)";
}

/* ── 並べ方 ───────────────────────────────────────
   分野が合うか（×40）と、届け先が合うか（+15）だけで点を出す。
   同点のときは「小さく始められる順」。入会2週目の人に、いきなり
   十数人や許認可が要るものを一番上に出さないため。
   性格（ウェルスダイナミクス・勇誠義礼）は順位に使わない。
   89件に性格タグを機械で振ると当てずっぽうになるので、
   性格は「あなたの入り方」を書くほうにだけ使っている。 ── */
function score(it){
  var s = 0, why = [];
  if (A.genre.indexOf(it.genre) >= 0) { s += 40; why.push(it.genre); }
  if (A.reach && it.reach === A.reach) { s += 15; why.push(it.reach + "に効く"); }
  return {s:s, why:why};
}

function pick(n){
  var all = DB.items.map(function(it){ var r = score(it); r.it = it; return r; })
    .filter(function(r){ return r.s > 0; })
    .sort(function(a, b){
      if (b.s !== a.s) return b.s - a.s;
      var sa = SCALE_ORDER[a.it.scale], sb = SCALE_ORDER[b.it.scale];
      if (sa !== sb) return sa - sb;
      return a.it.id < b.it.id ? -1 : 1;
    });

  /* 選んだ分野を1つずつ拾ってから、残りを埋める。
     3つ選んだのに1つの分野で5件埋まる、を避ける */
  var out = [], seen = {};
  A.genre.forEach(function(g){
    for (var i = 0; i < all.length; i++) {
      if (!seen[all[i].it.id] && all[i].it.genre === g) { out.push(all[i]); seen[all[i].it.id] = 1; break; }
    }
  });
  for (var i = 0; i < all.length && out.length < n; i++) {
    if (!seen[all[i].it.id]) { out.push(all[i]); seen[all[i].it.id] = 1; }
  }
  return {list: out.slice(0, n), rest: all.filter(function(r){ return !seen[r.it.id]; })};
}

function ynType(){ return A.yn1 || null; }

      (wd ?
        '<div class="pair"><b>人に渡していいこと</b><br>' +
          '組むなら ' + wd.catalyst.map(esc).join(" か ") + '。' + esc(wd.why) + '</div>' : '') +
      (y ? '<div class="pair"><b>バディに伝えておくこと</b><br>' + esc(y.buddy) + '</div>' : '') +
    '</section>' : '') +

    actCard("head") +

    '<h4 class="sec">あなたに向いているプロジェクト</h4>' +
    '<p class="hint">上から順に、小さく始められるものです。</p>' +
    ranked.map(function(r, i){ return card(r, i); }).join("") +

    (reals.length ?
      '<h4 class="sec">もう動いている場所</h4>' +
      '<p class="hint">同じ分野で、実際に続いている活動です。ゼロから立ち上げなくても、' +
      'すでにある場に入れてもらうという入り方があります。まず見に行く、連絡してみる、で十分です。</p>' +
      reals.map(function(x){ return realCard(x); }).join("")
      : '') +

    (big.length ?
      '<h4 class="sec">人が集まったら、これも</h4>' +
      '<p class="hint">十数人か、許認可が要るもの。いまは無理でも、行き先として置いておいてください。</p>' +
      big.map(function(r, i){ return card(r, i, true); }).join("")
      : '') +

    (y ?
    '<section class="block yn" style="' + (YN_HUE[t] || "") + '">' +
      '<h4>' + esc(t) + 'タイプ：' + esc(y.head) + '</h4>' +
      '<p>' + esc(y.desc) + '</p>' +
      '<div class="pair"><b>プロジェクトの進め方</b><br>' + esc(y.proj) + '</div>' +
      '<div class="pair"><b>大切にされていると感じるのは</b><br>' + esc(y.love) + '<br>' +
        '<span class="dim">この愛のかたちは' + esc(y.ai) + '</span></div>' +
      (A.yn2 && A.yn1 !== A.yn2 ?
        '<p class="note">' +
        '2つの質問で判定が割れました（注目点は' + esc(A.yn1) + '、愛を感じるポイントは' + esc(A.yn2) + '）。' +
        '会話なしでは決めきれないタイプ分けなので、' +
        esc(A.yn1) + 'と' + esc(A.yn2) + 'の両方の説明を読んで、近い方を自分で選んでください。' +
        'ここでは' + esc(A.yn1) + 'として結果を出しています。</p>' : '') +
    '</section>' : '') +

    (wd ?
    '<section class="block wd">' +
      '<h4>ひとりでやらない</h4>' +
      '<p>' + esc(wdKey) + 'のチームでの持ち場は「' + esc(wd.role) + '」。ここから外れる作業は、はじめから人に渡した方が早く進みます。</p>' +
      '<div class="pair"><b>バディに向くのは ' + wd.catalyst.map(esc).join(" か ") + '</b><br>' + esc(wd.why) + '</div>' +
      '<div class="pair"><b>チームの外に置いておきたいのは ' + esc(wd.support) + '</b><br>' +
        '頼れる相手を先に1人決めてから動き出すと、止まりにくくなります。</div>' +
    '</section>' : '') +

    actCard("tail") +

    '<div class="restart"><button type="button" class="go" id="again">選び直す</button></div>' +
  '</div>';

  wireAct();
  document.getElementById("again").onclick = function(){ reset(); render(); top(); };
  logEvent("result");
}

/* ── カード ───────────────────────────────────────── */
function card(r, i, isBig){
  var it = r.it;
  return '<article class="' + ((i === 0 && !isBig) ? "top" : "") + '"' +
    ' style="' + genreHue(it.genre) + '">' +
    '<p class="rank">' + esc(it.genre) + '／' + esc(it.scaleLabel) + '</p>' +
    '<h3>' + esc(it.title) + '</h3>' +
    '<p class="cause">' + esc(it.cause) + '</p>' +
    '<dl>' +
      '<dt>今週やること</dt><dd class="strong">' + esc(it.step) + '</dd>' +
      (it.land ? '<dt>そのあと</dt><dd>' + esc(it.land) + '</dd>' : '') +
      (it.orgs ? '<dt>行政の入口</dt><dd>' + esc(it.orgs) + '</dd>' : '') +
      (it.numbers ? '<dt>測る数字</dt><dd>' + esc(it.numbers) + '</dd>' : '') +
      (it.ref ? '<dt>元ネタ</dt><dd>' + esc(it.ref) + '</dd>' : '') +
    '</dl>' +
  '</article>';
}

function realCard(x){
  return '<article class="real" style="' + genreHue(x.genre[0]) + '">' +
    '<p class="rank">' + esc(x.genre.join("・")) + '／実際に続いている活動</p>' +
    '<h3>' + esc(x.title) + '</h3>' +
    '<dl>' +
      '<dt>やっていること</dt><dd>' + esc(x.summary) + '</dd>' +
      (x.result ? '<dt>出ている成果</dt><dd>' + esc(x.result) + '</dd>' : '') +
      (x.orgs ? '<dt>関わっている人</dt><dd>' + esc(x.orgs) + '</dd>' : '') +
    '</dl>' +
    (x.url ? '<p class="src">見に行く：<a href="' + esc(x.url) + '" target="_blank" rel="noopener">' +
      esc(host(x.url)) + '</a></p>' : '') +
  '</article>';
}
function host(u){
  try { return new URL(u).hostname; } catch (e) { return u; }
}

/* ── 次の行動へ：コピーカード ───────────────────────── */
function actCard(pos){
  var wantName = CFG.askName && !!CFG.logEndpoint;
  return '<div class="act ' + (pos === "tail" ? "tail" : "") + '">' +
    '<h4>' + (pos === "tail" ? "決めたら、ここから先へ" : "まず、バディに見せる") + '</h4>' +
    '<p>結果を短いテキストにまとめてコピーします。Discordの自己紹介チャンネルに貼るか、バディにそのまま送ってください。' +
      '貼った時点で、今月やることの仮決めは終わりです。</p>' +
    (wantName ?
      '<div class="namefield"><label for="nm-' + pos + '">Discordの表示名（任意・運営の記録用）</label>' +
      '<input type="text" id="nm-' + pos + '" class="nm" autocomplete="off" maxlength="40" value="' + esc(A.name) + '"></div>' : '') +
    '<button type="button" class="go copybtn" data-pos="' + pos + '">結果をコピーする</button>' +
    '<p class="copied" data-msg="' + pos + '" role="status"></p>' +
    '<details class="previewbox"><summary>コピーされる内容を見る</summary>' +
      '<pre class="preview">' + esc(copyText()) + '</pre></details>' +
  '</div>';
}

function copyText(){
  if (!lastResult) return "";
  var L = [];
  L.push("【診断結果】");
  if (A.name) L.push("名前：" + A.name);
  L.push("気になる分野：" + A.genre.join("／"));
  if (A.reach) L.push("届けたい範囲：" + A.reach);
  if (lastResult.wdKey) L.push("ウェルスダイナミクス：" + lastResult.wdKey + "（" + lastResult.wd.role.split("。")[0] + "）");
  if (lastResult.yn) L.push("勇誠義礼：" + lastResult.yn + "タイプ（" + YN[lastResult.yn].loveShort + "）");
  if (lastResult.combo) L.push("わたしの入り方：" + lastResult.combo);
  L.push("気になったプロジェクト：");
  lastResult.ranked.slice(0, 3).forEach(function(r, i){ L.push(" " + (i + 1) + ". " + r.it.title); });
  if (lastResult.ranked[0]) L.push("今週やること：" + lastResult.ranked[0].it.step);
  return L.join("\n");
}

function wireAct(){
  Array.prototype.forEach.call(app.querySelectorAll(".nm"), function(inp){
    inp.oninput = function(){
      A.name = inp.value.trim();
      Array.prototype.forEach.call(app.querySelectorAll(".nm"), function(o){ if (o !== inp) o.value = inp.value; });
      refreshPreviews();
    };
  });
  Array.prototype.forEach.call(app.querySelectorAll(".copybtn"), function(btn){
    btn.onclick = function(){
      var msg = app.querySelector('.copied[data-msg="' + btn.getAttribute("data-pos") + '"]');
      copyToClipboard(copyText(), function(ok){
        btn.textContent = ok ? "コピーしました" : "結果をコピーする";
        btn.className = ok ? "go copybtn done" : "go copybtn";
        msg.textContent = ok
          ? "Discordの自己紹介チャンネルに貼ってください。"
          : "このブラウザではコピーが使えませんでした。下に出した文章を、手で選んでコピーしてください。";
        if (!ok) {
          var box = btn.parentNode.querySelector("details.previewbox");
          if (box) { box.open = true; box.scrollIntoView({block:"nearest"}); }
        } else {
          logEvent("copy");
          setTimeout(function(){
            btn.textContent = "結果をコピーする";
            btn.className = "go copybtn";
          }, 4000);
        }
      });
    };
  });
}

function refreshPreviews(){
  var txt = copyText();
  Array.prototype.forEach.call(app.querySelectorAll("pre.preview"), function(p){ p.textContent = txt; });
}

/* クリップボード。navigator.clipboard は HTTPS でないと使えないので、
   textarea + execCommand のフォールバックを必ず持つ */
function copyToClipboard(text, done){
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ done(legacyCopy(text)); });
  } else {
    done(legacyCopy(text));
  }
}
function legacyCopy(text){
  var pad = document.getElementById("fallbackpad");
  if (!pad) return false;
  var ok = false;
  try {
    pad.removeAttribute("aria-hidden");
    pad.value = text;
    pad.readOnly = false;
    /* iOS Safari は textarea.select() だけでは選択できないことがあるので Range も張る */
    pad.contentEditable = "true";
    pad.focus();
    var range = document.createRange();
    range.selectNodeContents(pad);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    pad.setSelectionRange(0, text.length);
    ok = document.execCommand("copy");
    sel.removeAllRanges();
  } catch (e) {
    ok = false;
  }
  try {
    pad.contentEditable = "false";
    pad.readOnly = true;
    pad.setAttribute("aria-hidden", "true");
    pad.blur();
  } catch (e) { /* 後片付けの失敗は無視 */ }
  return !!ok;
}

/* ── 回答の記録。logEndpoint が空なら一切送らない ── */
function markStarted(){
  if (started) return;
  started = true;
  logEvent("start");
}
function logEvent(kind){
  if (!CFG.logEndpoint) return;
  var payload = {
    session: SESSION,
    secret: CFG.logSecret || "",
    event: kind,
    at: new Date().toISOString(),
    set: CFG.questionSet,
    name: A.name || "",
    genre: A.genre, reach: A.reach,
    wd: A.wd, yn1: A.yn1, yn2: A.yn2,
    top: lastResult ? lastResult.ranked.map(function(r){ return r.it.id; }) : [],
    reals: lastResult ? lastResult.reals.map(function(x){ return x.id; }) : []
  };
  try {
    fetch(CFG.logEndpoint, {
      method: "POST",
      mode: "no-cors",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify(payload),
      keepalive: true
    })["catch"](function(){ /* 記録に失敗しても診断は止めない */ });
  } catch (e) { /* 同上 */ }
}
