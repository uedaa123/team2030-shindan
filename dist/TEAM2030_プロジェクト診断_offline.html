<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>チーム2030 プロジェクト診断</title>
<!-- オフライン配布版（build.mjs が自動生成）。直接編集しないこと。
     直すのは assets/ と data/ の側。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700&display=swap">
<style>
/* チーム2030 プロジェクト診断
   ── 配色の考え方 ──────────────────────────────────
   「気になっていること」10項目に、それぞれ固有の色を割り当てている（--h0〜--h9、
   data/cases.json の issues の並び順）。選んだ課題の色が、そのまま結果画面の
   事例カードの上辺に出る。色は飾りではなく、自分が何を選んだかの目印。
   勇誠義礼の4タイプにも固有色がある（勇＝朱、誠＝青、義＝橙、礼＝桃）。
   色の指定は --c を各要素に流し込む形に統一してあるので、
   増やすときは --h10 を足して app.js の hue() が拾えるようにするだけでよい。 */

:root{
  /* 課題10色（data/cases.json の issues と同じ順） */
  --h0:#e8471f;  /* 担い手がいない          朱 */
  --h1:#1d7fc2;  /* 買い物や移動が不便      青 */
  --h2:#8438c9;  /* 空き家・空き店舗が多い  紫 */
  --h3:#159a5c;  /* 自然環境が失われている  緑 */
  --h4:#4a4cdb;  /* 若者が出ていく          藍 */
  --h5:#00867c;  /* 高齢化・見守りが必要    青緑 */
  --h6:#5f8f18;  /* お金が地域の外に出ていく 黄緑 */
  --h7:#d62d72;  /* 地域の魅力が知られていない 桃 */
  --h8:#b07d00;  /* 子どもの体験機会が少ない 黄 */
  --h9:#d9700a;  /* 技術や文化が途切れそう  橙 */

  /* 同じ10色の、塗り用の鮮やかな側。--hN は文字にも使うので白地で読める濃さに
     抑えてある。面で見せるところ（カードの上辺・丸・バー）は --hNv を使う。 */
  --h0v:#ff5a2d; --h1v:#2fa3e8; --h2v:#a855f7; --h3v:#18c26e; --h4v:#6366f1;
  --h5v:#00c2b2; --h6v:#84cc16; --h7v:#f43f8e; --h8v:#fbbf24; --h9v:#fb8b1e;

  /* 勇誠義礼 */
  --yu:#e8471f; --sei:#1d7fc2; --gi:#d9700a; --rei:#d62d72;

  --accent:#e8471f;
  --accent-soft:#fdeee9;

  /* 下地。純グレーではなく、濃紺に寄せた中間色 */
  --ink:#22263d;
  --ink-2:#59607a;
  --paper:#f4f6fa;
  --card:#ffffff;
  --deep:#20233f;
  --line:#d9deea;
  --line-2:#eaeef6;

  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",
            "Noto Sans JP",system-ui,sans-serif;
  --gothic:"Hiragino Sans","Yu Gothic","Noto Sans JP","Meiryo",system-ui,sans-serif;

  --r:14px;   /* カードの丸み */
  --r-s:10px; /* ボタンの丸み */
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --h0:#ff7a55; --h1:#4fb3f0; --h2:#bb7bf5; --h3:#3ed294; --h4:#8f91ff;
    --h5:#2ebfb2; --h6:#9fd13f; --h7:#ff6fa3; --h8:#f0bd3a; --h9:#ffa049;
    --h0v:#ff7a55; --h1v:#4fb3f0; --h2v:#bb7bf5; --h3v:#3ed294; --h4v:#8f91ff;
    --h5v:#2ebfb2; --h6v:#9fd13f; --h7v:#ff6fa3; --h8v:#f0bd3a; --h9v:#ffa049;
    --yu:#ff7a55; --sei:#4fb3f0; --gi:#ffa049; --rei:#ff6fa3;
    --accent:#ff7a55; --accent-soft:#33221d;
    --ink:#e9ecf6; --ink-2:#a2aac4; --paper:#12142a; --card:#1c1f38;
    --deep:#0c0e20; --line:#333856; --line-2:#272b46;
  }
}
:root[data-theme="dark"]{
  --h0:#ff7a55; --h1:#4fb3f0; --h2:#bb7bf5; --h3:#3ed294; --h4:#8f91ff;
  --h5:#2ebfb2; --h6:#9fd13f; --h7:#ff6fa3; --h8:#f0bd3a; --h9:#ffa049;
  --h0v:#ff7a55; --h1v:#4fb3f0; --h2v:#bb7bf5; --h3v:#3ed294; --h4v:#8f91ff;
  --h5v:#2ebfb2; --h6v:#9fd13f; --h7v:#ff6fa3; --h8v:#f0bd3a; --h9v:#ffa049;
  --yu:#ff7a55; --sei:#4fb3f0; --gi:#ffa049; --rei:#ff6fa3;
  --accent:#ff7a55; --accent-soft:#33221d;
  --ink:#e9ecf6; --ink-2:#a2aac4; --paper:#12142a; --card:#1c1f38;
  --deep:#0c0e20; --line:#333856; --line-2:#272b46;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--gothic);
     font-size:15px;line-height:1.8;-webkit-font-smoothing:antialiased;
     -webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 96px}
.wrap#app{padding-bottom:calc(96px + env(safe-area-inset-bottom))}

/* ── ヘッダー ──────────────────────────────────── */
header{background:var(--deep);color:#fff;padding:0 0 40px}
/* 10色の帯。このツールが扱う「気になっていること」の数だけ色がある */
header:before{content:"";display:block;height:7px;
  background:linear-gradient(90deg,
    var(--h0v) 0 10%, var(--h1v) 10% 20%, var(--h2v) 20% 30%, var(--h3v) 30% 40%,
    var(--h4v) 40% 50%, var(--h5v) 50% 60%, var(--h6v) 60% 70%, var(--h7v) 70% 80%,
    var(--h8v) 80% 90%, var(--h9v) 90% 100%)}
header .wrap{padding-top:40px;padding-bottom:0}
h1{font-family:var(--display);font-weight:700;font-size:38px;line-height:1.3;
   margin:0 0 14px;letter-spacing:.01em;text-wrap:balance}
header p{margin:0;color:#b8bfdc;font-size:14px;line-height:1.85;max-width:52ch}
@media(max-width:560px){
  header{padding-bottom:28px}
  header .wrap{padding-top:28px}
  h1{font-size:29px}
}

/* 進捗バー。進むほど色数が増える */
.bar{height:5px;background:var(--line-2);position:sticky;top:0;z-index:5}
.bar i{display:block;height:100%;width:0;transition:width .35s ease;
  background:linear-gradient(90deg,var(--h0v),var(--h8v) 45%,var(--h3v) 70%,var(--h4v));
  background-size:760px 100%;background-repeat:no-repeat}

/* ── 設問 ──────────────────────────────────────── */
.step{padding:40px 0 0}
.stepno{font-family:var(--display);font-weight:700;font-size:12px;color:var(--accent);
  margin:0 0 8px;letter-spacing:.14em}
h2{font-family:var(--display);font-weight:700;font-size:25px;line-height:1.5;
   margin:0 0 8px;text-wrap:balance}
@media(max-width:560px){.step{padding:28px 0 0}h2{font-size:22px}}
.hint{color:var(--ink-2);font-size:13px;margin:0 0 22px}
.sublabel{font-family:var(--display);font-weight:700;font-size:16px;margin:24px 0 10px}

.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
@media(max-width:560px){.opts.two{grid-template-columns:1fr}}

button.opt{font:inherit;text-align:left;background:var(--card);
  border:2px solid var(--line);border-radius:var(--r-s);
  padding:14px 16px;cursor:pointer;color:var(--ink);min-height:50px;
  transition:border-color .13s,background .13s,transform .09s}
button.opt:hover{border-color:var(--c,var(--accent))}
button.opt:active{transform:scale(.99)}
button.opt:focus-visible{outline:3px solid var(--c,var(--accent));outline-offset:2px}
button.opt.on{border-color:var(--c,var(--accent));
  background:color-mix(in srgb,var(--cv,var(--c,var(--accent))) 12%,var(--card))}
button.opt.off{opacity:.45}
button.opt b{display:block;font-weight:700;font-family:var(--display)}
button.opt span{display:block;font-size:12.5px;color:var(--ink-2);margin-top:3px;
  line-height:1.7;font-family:var(--gothic)}

/* 色を持つ選択肢（気になっていること）は、色の丸を先頭に出す */
button.opt.hue{display:flex;gap:11px;align-items:flex-start}
button.opt.hue:before{content:"";flex:0 0 auto;width:15px;height:15px;border-radius:50%;
  background:var(--cv,var(--c));margin-top:5px;transition:box-shadow .13s}
button.opt.hue.on:before{box-shadow:0 0 0 4px color-mix(in srgb,var(--cv,var(--c)) 30%,transparent)}

.nav{display:flex;gap:12px;align-items:center;margin-top:28px;flex-wrap:wrap}
.go{font:inherit;font-family:var(--display);font-weight:700;background:var(--accent);
    color:#fff;border:0;border-radius:var(--r-s);padding:14px 28px;cursor:pointer;
    min-height:50px;transition:filter .13s,transform .09s}
.go:hover{filter:brightness(1.08)}
.go:active{transform:scale(.99)}
.go:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.go[disabled]{background:var(--line);color:var(--ink-2);cursor:not-allowed;filter:none}
.back{font:inherit;background:none;border:0;color:var(--ink-2);cursor:pointer;
      text-decoration:underline;padding:12px 4px;min-height:50px}
.back:hover{color:var(--ink)}
.back:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.count{font-size:12.5px;color:var(--ink-2);margin-left:auto;
  font-variant-numeric:tabular-nums}

/* ── 結果 ──────────────────────────────────────── */
.res{padding:36px 0 0}
.lede{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.6;
  margin:0 0 14px;text-wrap:balance}
.recap{font-size:12.5px;color:var(--ink-2);background:var(--card);
  border:2px solid var(--line-2);border-radius:var(--r-s);
  padding:13px 15px;margin:0 0 22px;line-height:1.9}
.recap b{color:var(--ink);font-weight:700}

/* 事例カード。上辺の色は、その事例がいちばん効く課題の色 */
article{background:var(--card);border:1px solid var(--line-2);
  border-top:6px solid var(--cv,var(--c,var(--line)));
  border-radius:var(--r);padding:20px 20px 18px;margin-bottom:14px}
article.top{box-shadow:0 2px 0 0 var(--line-2),0 10px 26px -18px var(--ink)}
.rank{font-family:var(--display);font-weight:700;font-size:11.5px;
  color:var(--c,var(--ink-2));margin:0 0 4px;letter-spacing:.06em}
h3{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.5;margin:0 0 10px;
   text-wrap:balance}
.fit{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.fit i{flex:1;height:7px;background:var(--line-2);border-radius:4px;overflow:hidden;display:block}
.fit i>i{display:block;height:100%;background:var(--cv,var(--c,var(--accent)));border-radius:4px}
.fit em{font-style:normal;font-size:11.5px;color:var(--ink-2);white-space:nowrap;
  font-variant-numeric:tabular-nums}
.why{font-size:12.5px;color:var(--ink-2);margin:-6px 0 15px;line-height:1.9}
.why s{text-decoration:none;color:var(--c,var(--accent));font-weight:700}
dl{margin:0;display:grid;grid-template-columns:6.5em 1fr;gap:8px 14px;font-size:13.5px}
@media(max-width:560px){dl{grid-template-columns:1fr;gap:2px 0}dl dt{margin-top:11px}}
dt{font-family:var(--display);font-weight:700;color:var(--ink-2);font-size:12px;padding-top:3px}
dd{margin:0;line-height:1.8}
.tags{margin:15px 0 0;font-size:12px;color:var(--ink-2)}
.tag{display:inline-block;background:var(--line-2);border-radius:999px;
  padding:3px 10px;margin:0 5px 5px 0}
.tag.hit{background:var(--c,var(--accent));color:#fff;font-weight:700}
.src{font-size:12px;margin-top:13px}
.src a{color:var(--c,var(--accent))}
.over{display:inline-block;background:var(--accent-soft);color:var(--accent);
  font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;margin-left:7px;
  white-space:nowrap;vertical-align:middle}

h4.sec{font-family:var(--display);font-weight:700;font-size:19px;margin:38px 0 4px}

/* ── 解説ブロック ─────────────────────────────── */
section.block{margin:36px 0 0;padding:24px 22px;border-radius:var(--r);
  background:var(--card);border:1px solid var(--line-2);
  border-top:6px solid var(--cv,var(--c,var(--accent)))}
section.block h4{font-family:var(--display);font-weight:700;font-size:19px;
  margin:0 0 10px;color:var(--ink);text-wrap:balance}
section.block p{margin:0 0 10px;font-size:13.5px;color:var(--ink-2);line-height:1.85}
section.block .pair{background:color-mix(in srgb,var(--c,var(--accent)) 7%,var(--card));
  border-radius:var(--r-s);padding:13px 15px;margin:11px 0 0;font-size:13.5px;
  line-height:1.85}
section.block .pair b{color:var(--ink);font-family:var(--display);font-weight:700}

/* 「ひとりでやらない」だけ濃紺の地。ページの中で一番強いブロック */
section.wd{background:var(--deep);border-color:var(--deep);color:#eef0fa}
section.wd h4{color:#fff}
section.wd p{color:#b8bfdc}
section.wd .pair{background:rgba(255,255,255,.08)}
section.wd .pair b{color:#fff}

ul.check{list-style:none;padding:0;margin:14px 0 0;font-size:13.5px}
ul.check li{padding:11px 0 11px 30px;border-top:1px solid var(--line-2);position:relative;
  line-height:1.75}
ul.check li:before{content:"";position:absolute;left:2px;top:16px;width:15px;height:15px;
  border:2px solid var(--cv,var(--c,var(--accent)));border-radius:5px}
.note{font-size:12px;color:var(--ink-2);border-left:3px solid var(--cv,var(--c,var(--accent)));
  padding:8px 0 8px 13px;margin:18px 0 0;line-height:1.85}
section.wd .note{color:#b8bfdc}
.restart{margin-top:34px}
.restart .go{background:var(--ink)}

/* ── 次の行動へ：コピーカード ───────────────────── */
.act{background:var(--card);border:2px solid var(--accent);border-radius:var(--r);
     padding:20px;margin:0 0 30px}
.act.tail{margin:36px 0 0}
.act h4{font-family:var(--display);font-weight:700;font-size:18px;margin:0 0 8px;
  text-wrap:balance}
.act p{font-size:12.5px;color:var(--ink-2);margin:0 0 14px;line-height:1.85}
.act .go{width:100%;text-align:center}
.act .go.done{background:var(--h3)}
.namefield{margin:0 0 14px}
.namefield label{display:block;font-size:12.5px;color:var(--ink-2);margin:0 0 6px}
.namefield input{font:inherit;width:100%;padding:12px 13px;border:2px solid var(--line);
  border-radius:var(--r-s);background:var(--paper);color:var(--ink);min-height:48px}
.namefield input:focus-visible{outline:3px solid var(--accent);outline-offset:1px;
  border-color:var(--accent)}
.copied{font-size:12.5px;color:var(--accent);font-weight:700;margin:11px 0 0;min-height:1.5em;
  line-height:1.7}
pre.preview{font-family:var(--gothic);font-size:12px;line-height:1.85;background:var(--paper);
  border-radius:var(--r-s);padding:14px;margin:12px 0 0;
  white-space:pre-wrap;word-break:break-word;color:var(--ink-2);max-height:15em;overflow:auto}
details.previewbox{margin:13px 0 0}
details.previewbox summary{font-size:12.5px;color:var(--ink-2);cursor:pointer;
  padding:4px 0}
details.previewbox summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px;
  border-radius:4px}

/* ── 読み込み失敗 ─────────────────────────────── */
.oops{background:var(--card);border:2px solid var(--accent);border-radius:var(--r);
  padding:22px;margin:40px 0 0}
.oops h2{font-size:20px;margin:0 0 10px}
.oops p{font-size:13.5px;color:var(--ink-2);margin:0 0 10px;line-height:1.85}
.oops code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;
  background:var(--paper);padding:2px 6px;border-radius:5px}

/* 自動コピーが使えないブラウザ向けの控え。
   opacity:0 や display:none にすると execCommand("copy") が効かない端末があるので、
   位置だけで画面外へ逃がす。 */
#fallbackpad{position:fixed;left:-9999px;top:0;width:1px;height:1px;
  border:0;padding:0;font-size:16px;pointer-events:none}

@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{transition-duration:.01ms !important;animation-duration:.01ms !important}
}

</style>
</head>
<body>

<header><div class="wrap">
<h1>プロジェクト診断</h1>
<p>住んでいる場所と、気になっていることを選んでいくと、似た条件で実際に動いている事例が出てきます。最後に、いくら用意すれば始められるかまで見られます。</p>
</div></header>

<div class="bar"><i id="bar"></i></div>

<main class="wrap" id="app" aria-live="polite"></main>

<textarea id="fallbackpad" aria-hidden="true" tabindex="-1"></textarea>

<script>/* チーム2030 プロジェクト診断 ／ 運営が触る設定はこのファイルだけ
   ここを書き換えても、assets/app.js と data/cases.json は触らなくてよい */
window.T2030_CONFIG = {

  /* 事例データの場所。差し替えるときは data/cases.json を上書きするだけでよい */
  dataUrl: "data/cases.json",

  /* 回答をスプレッドシートに貯めるなら、GASのウェブアプリURLをここに貼る。
     空のままなら送信は一切行わない（ツールは普通に動く）。
     GASの中身は tools/gas-endpoint.gs にある。 */
  logEndpoint: "",

  /* GAS側で SECRET を設定したときだけ、同じ文字列をここにも入れる */
  logSecret: "",

  /* 質問の本数。"full" = 7問（2週目の仮プロジェクト決め用）
                  "short" = 3問（キックオフでその場で触らせる用）
     URLに ?q=3 を付けると、この設定にかかわらず3問版になる。
     ※どちらを使うかは運営未確定（引継ぎ資料 §8-⑤） */
  questionSet: "full",

  /* 結果画面に「Discordの表示名」欄を出すか。logEndpoint が空なら自動的に出ない */
  askName: true

/* ── 状態（メモリのみ） ────────────────────────────── */
var A, step, DB = null, lastResult = null, started = false;
var SESSION = "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

function reset() {
  A = {place:null, feat:[], issue:[], wd:null, yn1:null, yn2:null, cost:null, time:null, name:""};
  step = 0;
  lastResult = null;
}
reset();

var app = document.getElementById("app");
var bar = document.getElementById("bar");

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}
function top(){ window.scrollTo(0, 0); }
function progress(){ bar.style.width = (step / TOTAL * 100) + "%"; }

/* ── データ読み込み ───────────────────────────────── */
function boot(){
  if (EMBEDDED) { DB = EMBEDDED; render(); return; }
  fetch(CFG.dataUrl, {cache:"no-cache"})
    .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function(json){ DB = json; render(); })
    .catch(function(err){ failed(err); });
}

function failed(err){
  var isFile = location.protocol === "file:";
  app.innerHTML =
  '<div class="oops">' +
    '<h2>事例データを読み込めませんでした</h2>' +
    (isFile
      ? '<p>いま <code>file://</code> でこのファイルを直接開いています。この開き方では' +
        'ブラウザの決まり（CORS）で <code>data/cases.json</code> を読めません。</p>' +
        '<p>手元で確認するだけなら <code>dist/TEAM2030_プロジェクト診断_offline.html</code>（データ埋め込み版）を開いてください。' +
        'こちらのファイルは、Netlify などに置いた状態では問題なく動きます。</p>'
      : '<p><code>' + esc(CFG.dataUrl) + '</code> が見つからないか、JSONとして読めませんでした。' +
        'ファイルを差し替えた直後なら、書式が壊れていないか確認してください。</p>') +
    '<p class="note">' + esc(String((err && err.message) || err)) + '</p>' +
  '</div>';
}

/* ── 設問画面 ─────────────────────────────────────── */
function render(){
  progress();
  if (step >= STEPS.length) return results();
  var S = STEPS[step];
  if (S.type === "money") return money(S);

  var cur = A[S.key];
  var sel = function(v){ return S.type === "many" ? cur.indexOf(v) >= 0 : cur === v; };
  var opts = S.opts();
  var full = S.type === "many" && cur.length >= S.max;

  app.innerHTML =
  '<div class="step">' +
    '<p class="stepno">' + (step + 1) + ' / ' + TOTAL + '</p>' +
    '<h2>' + esc(S.q) + '</h2>' +
    '<p class="hint">' + esc(S.h || "") + '</p>' +
    '<div class="opts ' + (opts.length > 5 ? "two" : "") + '">' +
      opts.map(function(o){
        var on = sel(o.v);
        return '<button type="button" class="opt ' + (o.c ? "hue " : "") +
          (on ? "on" : (full ? "off" : "")) + '"' +
          (o.c ? ' style="' + o.c + '"' : '') +
          ' aria-pressed="' + (on ? "true" : "false") + '" data-v="' + esc(o.v) + '">' +
          '<b>' + esc(o.b) + '</b>' + (o.s ? '<span>' + esc(o.s) + '</span>' : '') + '</button>';
      }).join("") +
    '</div>' +
    '<div class="nav">' +
      (step > 0 ? '<button type="button" class="back" id="back">ひとつ戻る</button>' : '') +
      '<button type="button" class="go" id="go"' + (ready(S) ? "" : " disabled") + '>次へ</button>' +
      (S.type === "many" ? '<span class="count">' + cur.length + ' / ' + S.max + ' 選択中</span>' : '') +
    '</div>' +
  '</div>';

  Array.prototype.forEach.call(app.querySelectorAll(".opt"), function(b){
    b.onclick = function(){
      var v = b.getAttribute("data-v");
      markStarted();
      if (S.type === "many") {
        var i = A[S.key].indexOf(v);
        if (i >= 0) A[S.key].splice(i, 1);
        else if (A[S.key].length < S.max) A[S.key].push(v);
        render();
      } else {
        /* 単一選択はタップした瞬間に次へ進む（確定ボタンなし。§3） */
        A[S.key] = v; step++; render(); top();
      }
    };
  });
  var g = document.getElementById("go");
  if (g) g.onclick = function(){ step++; render(); top(); };
  var bk = document.getElementById("back");
  if (bk) bk.onclick = function(){ step--; render(); top(); };
}
function ready(S){ return S.type === "many" ? A[S.key].length > 0 : !!A[S.key]; }

function money(S){
  app.innerHTML =
  '<div class="step">' +
    '<p class="stepno">' + (step + 1) + ' / ' + TOTAL + '</p>' +
    '<h2>' + esc(S.q) + '</h2>' +
    '<p class="hint">' + esc(S.h) + '</p>' +
    '<p class="sublabel">ひと月に使える時間</p>' +
    '<div class="opts">' + TIMES.map(function(t){
      return '<button type="button" class="opt t ' + (A.time === t ? "on" : "") + '"' +
        ' aria-pressed="' + (A.time === t ? "true" : "false") + '" data-v="' + esc(t) + '"><b>' + esc(t) + '</b></button>';
    }).join("") + '</div>' +
    '<p class="sublabel">最初に出せるお金</p>' +
    '<div class="opts">' + COSTS.map(function(c){
      return '<button type="button" class="opt c ' + (A.cost === c ? "on" : "") + '"' +
        ' aria-pressed="' + (A.cost === c ? "true" : "false") + '" data-v="' + esc(c) + '"><b>' + esc(c) + '</b></button>';
    }).join("") + '</div>' +
    '<div class="nav">' +
      '<button type="button" class="back" id="back">ひとつ戻る</button>' +
      '<button type="button" class="go" id="go"' + (A.time && A.cost ? "" : " disabled") + '>事例を見る</button>' +
    '</div>' +
  '</div>';

  Array.prototype.forEach.call(app.querySelectorAll(".opt.t"), function(b){
    b.onclick = function(){ markStarted(); A.time = b.getAttribute("data-v"); money(S); };
  });
  Array.prototype.forEach.call(app.querySelectorAll(".opt.c"), function(b){
    b.onclick = function(){ markStarted(); A.cost = b.getAttribute("data-v"); money(S); };
  });
  document.getElementById("back").onclick = function(){ step--; render(); top(); };
  var g = document.getElementById("go");
  if (A.time && A.cost) g.onclick = function(){ step++; render(); top(); };
}

/* ── スコアリング（引継ぎ資料 §5）
   配点を変えたら node tools/verify-scoring.mjs を必ず流すこと ── */
function ynType(){ return A.yn1 || null; }

function score(it){
  var s = 0, why = [];
  var t = ynType();
  var ih = it.issue.filter(function(x){ return A.issue.indexOf(x) >= 0; });
  if (ih.length) { s += ih.length * 30; why.push("「" + ih[0] + "」に効く"); }
  var fh = it.feat.filter(function(x){ return A.feat.indexOf(x) >= 0; });
  if (fh.length) { s += fh.length * 12; why.push(fh[0] + "土地の事例"); }
  if (it.place.indexOf(A.place) >= 0 || it.place.indexOf("どこでも") >= 0) { s += 15; why.push("同じ規模の地域"); }
  if (A.wd && A.wd !== "unknown" && it.wd.indexOf(A.wd) >= 0) { s += 18; why.push(A.wd + "が主役になれる"); }
  /* 3問版では勇誠義礼を聞かないので、この項は加点も減点もしない */
  if (t) {
    if (it.yn && it.yn.indexOf(t) >= 0) { s += 22; why.push(t + "タイプの進め方に合う"); }
    else { s -= 8; }
  }
  var co = COSTS.indexOf(it.cost) - COSTS.indexOf(A.cost);
  var to = TIMES.indexOf(it.time) - TIMES.indexOf(A.time);
  var raw = s;
  if (co > 0) s -= co * 14;
  if (to > 0) s -= to * 10;
  return {s:s, raw:raw, why:why, over: co > 0 || to > 0};
}

/* ── 結果画面 ─────────────────────────────────────── */
function results(){
  progress();
  var all = DB.items.map(function(it){
    var r = score(it); r.it = it; return r;
  });
  var ranked  = all.filter(function(r){ return !r.over; }).sort(function(a,b){ return b.s - a.s; }).slice(0, 5);
  var stretch = all.filter(function(r){ return r.over; }).sort(function(a,b){ return b.raw - a.raw; }).slice(0, 2);
  var max = Math.max(ranked[0] ? ranked[0].s : 1, 1);
  var t = ynType();
  var y = t ? YN[t] : null;
  var wd = (A.wd && A.wd !== "unknown") ? WDROLE[A.wd] : null;

  lastResult = {ranked:ranked, stretch:stretch, yn:t, wd:wd};

  var recap =
    '<b>' + esc(A.place) + '</b>' +
    (A.feat.length ? '／あるもの <b>' + A.feat.map(esc).join("・") + '</b>' : '') +
    '／気になること <b>' + A.issue.map(esc).join("・") + '</b>' +
    (wd ? '／<b>' + esc(A.wd) + '</b>' : '') +
    (t ? '／<b>' + esc(t) + 'タイプ</b>' : '') +
    '／' + esc(A.time) + '・' + esc(A.cost);

  app.innerHTML =
  '<div class="res">' +
    '<p class="lede">この条件に近いところで、実際に動いている事例です。</p>' +
    '<p class="recap">' + recap + '</p>' +

    actCard("head") +

    ranked.map(function(r, i){ return card(r, i, max, false); }).join("") +

    /* 予算・時間を最大にすると超過する事例が無くなる。その時は枠ごと出さない。
       それ以外では必ず残す（§7-3。消すと成長の行き先が消える） */
    (stretch.length ?
      '<h4 class="sec">いまは少し届かないもの</h4>' +
      '<p class="hint">条件そのものは合っています。予算か時間が増えたときに、もう一度見てください。</p>' +
      stretch.map(function(r, i){ return card(r, i, Math.max(r.raw, max), true); }).join("")
      : '') +

    (wd ?
    '<section class="block wd">' +
      '<h4>ひとりでやらない</h4>' +
      '<p>' + esc(A.wd) + 'のチームでの持ち場は「' + esc(wd.role) + '」。ここから外れる作業は、はじめから人に渡した方が早く進みます。</p>' +
      '<div class="pair"><b>バディに向くのは ' + wd.catalyst.map(esc).join(" か ") + '</b><br>' + esc(wd.why) + '</div>' +
      '<div class="pair"><b>チームの外に置いておきたいのは ' + esc(wd.support) + '</b><br>' +
        '頼れる相手を先に1人決めてから動き出すと、止まりにくくなります。</div>' +
    '</section>' : '') +

    (y ?
    '<section class="block yn" style="' + (YN_HUE[t] || "--c:var(--accent);--cv:var(--accent)") + '">' +
      '<h4>' + esc(t) + 'タイプ：' + esc(y.head) + '</h4>' +
      '<p>' + esc(y.desc) + '</p>' +
      '<div class="pair"><b>プロジェクトの進め方</b><br>' + esc(y.proj) + '</div>' +
      '<div class="pair"><b>大切にされていると感じるのは</b><br>' + esc(y.love) + '<br>' +
        '<span style="font-size:12.5px;opacity:.8">この愛のかたちは' + esc(y.ai) + '</span></div>' +
      '<div class="pair"><b>バディに伝えておくこと</b><br>' + esc(y.buddy) + '</div>' +
      (A.yn2 && A.yn1 !== A.yn2 ?
        '<p class="note">' +
        '2つの質問で判定が割れました（注目点は' + esc(A.yn1) + '、愛を感じるポイントは' + esc(A.yn2) + '）。' +
        '腕組み・手組みだけでも会話なしでも決めきれないタイプ分けなので、' +
        esc(A.yn1) + 'と' + esc(A.yn2) + 'の両方の説明を読んで、近い方を自分で選んでください。' +
        'ここでは' + esc(A.yn1) + 'として結果を出しています。</p>' : '') +
    '</section>' : '') +

    '<section class="block money" style="--c:var(--h6);--cv:var(--h6v)">' +
      '<h4>始める前に、お金の見通しを立てる</h4>' +
      '<p>' + esc(A.cost) + '・' + esc(A.time) + 'で始める前提です。ここが埋まらないうちに人を集めると、途中で止まります。</p>' +
      '<ul class="check">' +
        '<li>初回にかかる実費を書き出した（材料・場所代・保険・交通費）</li>' +
        '<li>2年目以降の原資を決めた（売上／会費／協賛／行政の支援／持ち出し）</li>' +
        '<li>持ち出しなら、いくらまでなら続けられるか上限を決めた</li>' +
        '<li>行政の窓口に一度電話した（制度の有無と、担当課の名前を確認）</li>' +
        '<li>お金を扱うなら、記録の担当を自分以外に決めた</li>' +
      '</ul>' +
      '<p class="note">補助金は年度単位で募集が動きます。今年度に間に合わなくても、来年度の募集に合わせて準備すれば十分です。まず担当課の名前を控えるところまでで、今週は終わりで構いません。</p>' +
    '</section>' +

    actCard("tail") +

    '<div class="restart"><button type="button" class="go" id="again">条件を変えてやり直す</button></div>' +
  '</div>';

  wireAct();
  document.getElementById("again").onclick = function(){ reset(); render(); top(); };
  logEvent("result");
}

/* ── 次の行動へ：コピーカード（§8-①。このツールで最優先の機能） ── */
function actCard(pos){
  var wantName = CFG.askName && !!CFG.logEndpoint;
  return '<div class="act ' + (pos === "tail" ? "tail" : "") + '">' +
    '<h4>' + (pos === "tail" ? "決めたら、ここから先へ" : "まず、バディに見せる") + '</h4>' +
    '<p>結果を短いテキストにまとめてコピーします。Discordの自己紹介チャンネルに貼るか、バディにそのまま送ってください。' +
      '貼った時点で、今月やることの仮決めは終わりです。</p>' +
    (wantName ?
      '<div class="namefield"><label for="nm-' + pos + '">Discordの表示名（任意・運営の記録用）</label>' +
      '<input type="text" id="nm-' + pos + '" class="nm" autocomplete="off" maxlength="40" value="' + esc(A.name) + '"></div>' : '') +
    '<button type="button" class="go copybtn" data-pos="' + pos + '">結果をコピーする</button>' +
    '<p class="copied" data-msg="' + pos + '" role="status"></p>' +
    '<details class="previewbox"><summary>コピーされる内容を見る</summary>' +
      '<pre class="preview">' + esc(copyText()) + '</pre></details>' +
  '</div>';
}

function copyText(){
  if (!lastResult) return "";
  var L = [];
  L.push("【診断結果】");
  if (A.name) L.push("名前：" + A.name);
  L.push("地域：" + A.place + (A.feat.length ? "／" + A.feat.join("・") : ""));
  L.push("気になること：" + A.issue.join("／"));
  if (lastResult.wd) L.push("ウェルスダイナミクス：" + A.wd + "（" + lastResult.wd.role.split("。")[0] + "）");
  if (lastResult.yn) L.push("勇誠義礼：" + lastResult.yn + "タイプ（" + YN[lastResult.yn].loveShort + "）");
  L.push("気になった事例：");
  lastResult.ranked.slice(0, 3).forEach(function(r, i){ L.push(" " + (i + 1) + ". " + r.it.title); });
  if (lastResult.ranked[0]) L.push("最初の一歩：" + lastResult.ranked[0].it.step);
  L.push("使える時間・お金：" + A.time + "／" + A.cost);
  return L.join("\n");
}

function wireAct(){
  Array.prototype.forEach.call(app.querySelectorAll(".nm"), function(inp){
    inp.oninput = function(){
      A.name = inp.value.trim();
      /* もう一方のカードの入力欄とプレビューを合わせる（画面は作り直さない） */
      Array.prototype.forEach.call(app.querySelectorAll(".nm"), function(o){ if (o !== inp) o.value = inp.value; });
      refreshPreviews();
    };
  });
  Array.prototype.forEach.call(app.querySelectorAll(".copybtn"), function(btn){
    btn.onclick = function(){
      var msg = app.querySelector('.copied[data-msg="' + btn.getAttribute("data-pos") + '"]');
      copyToClipboard(copyText(), function(ok){
        btn.textContent = ok ? "コピーしました" : "結果をコピーする";
        if (ok) { btn.className = "go copybtn done"; } else { btn.className = "go copybtn"; }
        msg.textContent = ok
          ? "Discordの自己紹介チャンネルに貼ってください。"
          : "このブラウザではコピーが使えませんでした。下に出した文章を、手で選んでコピーしてください。";
        if (!ok) {
          /* 自動コピーができないときは、手で選べるように本文を開いておく */
          var box = btn.parentNode.querySelector("details.previewbox");
          if (box) { box.open = true; box.scrollIntoView({block:"nearest"}); }
        }
        if (ok) {
          logEvent("copy");
          setTimeout(function(){
            btn.textContent = "結果をコピーする";
            btn.className = "go copybtn";
          }, 4000);
        }
      });
    };
  });
}

function refreshPreviews(){
  var txt = copyText();
  Array.prototype.forEach.call(app.querySelectorAll("pre.preview"), function(p){ p.textContent = txt; });
}

/* クリップボード。navigator.clipboard は HTTPS でないと使えないので、
   textarea + execCommand のフォールバックを必ず持つ（§8-①） */
function copyToClipboard(text, done){
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ done(legacyCopy(text)); });
  } else {
    done(legacyCopy(text));
  }
}
function legacyCopy(text){
  var pad = document.getElementById("fallbackpad");
  if (!pad) return false;
  var ok = false;
  try {
    pad.removeAttribute("aria-hidden");
    pad.value = text;
    pad.readOnly = false;
    /* iOS Safari は textarea.select() だけでは選択できないことがあるので、
       Range を作って選択し直す */
    pad.contentEditable = "true";
    pad.focus();
    var range = document.createRange();
    range.selectNodeContents(pad);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    pad.setSelectionRange(0, text.length);
    ok = document.execCommand("copy");
    sel.removeAllRanges();
  } catch (e) {
    ok = false;
  }
  try {
    pad.contentEditable = "false";
    pad.readOnly = true;
    pad.setAttribute("aria-hidden", "true");
    pad.blur();
  } catch (e) { /* 後片付けの失敗は無視 */ }
  return !!ok;
}

/* ── 回答の記録（§8-③）。logEndpoint が空なら一切送らない ── */
function markStarted(){
  if (started) return;
  started = true;
  logEvent("start");
}
function logEvent(kind){
  if (!CFG.logEndpoint) return;
  var payload = {
    session: SESSION,
    secret: CFG.logSecret || "",
    event: kind,
    at: new Date().toISOString(),
    set: CFG.questionSet,
    name: A.name || "",
    place: A.place, feat: A.feat, issue: A.issue,
    wd: A.wd, yn1: A.yn1, yn2: A.yn2, time: A.time, cost: A.cost,
    top: lastResult ? lastResult.ranked.map(function(r){ return r.it.id; }) : [],
    stretch: lastResult ? lastResult.stretch.map(function(r){ return r.it.id; }) : []
  };
  try {
    fetch(CFG.logEndpoint, {
      method: "POST",
      mode: "no-cors",
      /* text/plain にすると preflight が飛ばず、GAS 側でそのまま受け取れる */
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify(payload),
      keepalive: true
    })["catch"](function(){ /* 記録に失敗しても診断は止めない */ });
  } catch (e) { /* 同上 */ }
}

/* ── 事例カード ───────────────────────────────────── */
function card(r, i, max, isStretch){
  var it = r.it;
  var pct = Math.max(12, Math.round((isStretch ? r.raw : r.s) / max * 100));
  /* カードの色は、その事例が「自分の選んだ課題」のどれに効くかで決まる。
     どれにも当たらなければ、その事例の代表的な課題の色 */
  var lead = it.issue.filter(function(x){ return A.issue.indexOf(x) >= 0; })[0] || it.issue[0];
  var tag = function(list, selected){
    return list.map(function(x){
      return '<span class="tag ' + (selected.indexOf(x) >= 0 ? "hit" : "") + '">' + esc(x) + '</span>';
    }).join("");
  };
  return '<article class="' + ((i === 0 && !isStretch) ? "top" : "") + '"' +
    ' style="' + issueHue(lead) + '">' +
    '<p class="rank">' + (isStretch ? "条件は合う" : (i + 1) + "番目に近い") +
      (it.src === "事例集" ? "／実在事例" : "／企画のかたち") + '</p>' +
    '<h3>' + esc(it.title) +
      (r.over ? '<span class="over">' + esc(it.cost) + '・' + esc(it.time) + 'が必要</span>' : '') + '</h3>' +
    '<div class="fit"><i><i style="width:' + pct + '%"></i></i><em>適合度 ' + pct + '</em></div>' +
    '<p class="why">' + r.why.map(function(w){ return '<s>' + esc(w) + '</s>'; }).join(" ／ ") + '</p>' +
    '<dl>' +
      '<dt>何をする</dt><dd>' + esc(it.summary) + '</dd>' +
      '<dt>最初の一歩</dt><dd>' + esc(it.step) + '</dd>' +
      (it.apply ? '<dt>' + (it.src === "事例集" ? "応用の勘所" : "育て方") + '</dt><dd>' + esc(it.apply) + '</dd>' : '') +
      (it.result ? '<dt>' + (it.src === "事例集" ? "確認できた成果" : "測る数字") + '</dt><dd>' + esc(it.result) + '</dd>' : '') +
      (it.orgs ? '<dt>' + (it.src === "事例集" ? "関わる人" : "行政の入口") + '</dt><dd>' + esc(it.orgs) + '</dd>' : '') +
      '<dt>目安</dt><dd>' + esc(it.cost) + '・' + esc(it.time) + (it.term ? '・' + esc(it.term) : '') + '</dd>' +
    '</dl>' +
    '<p class="tags">' + tag(it.issue, A.issue) + tag(it.feat, A.feat) + '</p>' +
    (it.url ? '<p class="src">出典：<a href="' + esc(it.url) + '" target="_blank" rel="noopener">' +
      esc(host(it.url)) + '</a></p>' : '') +
  '</article>';
}
function host(u){
  try { return new URL(u).hostname; } catch (e) { return u; }
}

/* 配点を変えたときの確認用の口（tools/verify-scoring.mjs から使う）。
   画面の動きには一切影響しない。 */
window.T2030_TEST = {
  score: score,
  answers: function(){ return A; },
  setDB: function(d){ DB = d; },
  COSTS: COSTS, TIMES: TIMES, YN_ORDER: YN_ORDER
};

boot();

})();
